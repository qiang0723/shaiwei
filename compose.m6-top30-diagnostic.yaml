services:
  m6-top30-diagnostic-original:
    image: shaiwei:m6-top30-diagnostic-original-v1
    pull_policy: never
    profiles: [m6-top30-diagnostic]
    build:
      context: .
      dockerfile: Dockerfile.m6-top30-diagnostic
      args:
        BASE_IMAGE: shaiwei:m6-model-attribution-release-v1
        SHAIWEI_M6_TOP30_DIAGNOSTIC_GIT_HEAD: ${SHAIWEI_M6_TOP30_DIAGNOSTIC_GIT_HEAD:-}
        SHAIWEI_M6_TOP30_DIAGNOSTIC_ROLE: original
        SHAIWEI_M6_TOP30_DIAGNOSTIC_BASE_IMAGE_ID: sha256:3c40c9c74bbbda926433f2d49cd78128c665cbb84e071ab3d44d187ecc2cd40e
    init: true
    restart: "no"
    user: "${SHAIWEI_HOST_UID:-10001}:${SHAIWEI_HOST_GID:-10001}"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,size=1g,mode=1777]
    pids_limit: 128
    mem_limit: 4g
    cpus: 2.0
    environment: &runner_environment
      HOME: /tmp
      MPLCONFIGDIR: /tmp/matplotlib
      PYTHONPYCACHEPREFIX: /tmp/pycache
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    volumes:
      - {type: bind, source: ./config/m6_csi800_top30_compatibility_diagnostic_v1.yaml, target: /inputs/protocol.yaml, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./config/m6_csi800_top30_compatibility_diagnostic_scope_v1.json, target: /inputs/release.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/control/m6_csi800_top30_compatibility_diagnostic_v1/approval.json, target: /inputs/approval.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/qlib_bin, target: /qlib, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/m6_csi800_model_attribution_v1/effect, target: /m6-effect, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/m6_csi800_topk20_conversion_v1/effect, target: /failed-effect, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/m6_csi800_top30_compatibility_diagnostic_v1/original, target: /diagnostic/original, read_only: false, bind: {create_host_path: false}}
    command: [python, -m, shaiwei.research.top30_diagnostic.runner, --lane, original, --protocol, /inputs/protocol.yaml, --release, /inputs/release.json, --approval, /inputs/approval.json, --provider-root, /qlib, --m6-effect-root, /m6-effect, --failed-effect-root, /failed-effect, --output-root, /diagnostic/original]

  m6-top30-diagnostic-current:
    image: shaiwei:m6-top30-diagnostic-current-v1
    pull_policy: never
    profiles: [m6-top30-diagnostic]
    build:
      context: .
      dockerfile: Dockerfile.m6-top30-diagnostic
      args:
        BASE_IMAGE: shaiwei:m6-topk-conversion-release-v1
        SHAIWEI_M6_TOP30_DIAGNOSTIC_GIT_HEAD: ${SHAIWEI_M6_TOP30_DIAGNOSTIC_GIT_HEAD:-}
        SHAIWEI_M6_TOP30_DIAGNOSTIC_ROLE: current
        SHAIWEI_M6_TOP30_DIAGNOSTIC_BASE_IMAGE_ID: sha256:69c1a4976e4c89973789413d7a9635d575669e785c4fe4621d6b3f34e09afa17
    init: true
    restart: "no"
    user: "${SHAIWEI_HOST_UID:-10001}:${SHAIWEI_HOST_GID:-10001}"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,size=1g,mode=1777]
    pids_limit: 128
    mem_limit: 4g
    cpus: 2.0
    environment: *runner_environment
    volumes:
      - {type: bind, source: ./config/m6_csi800_top30_compatibility_diagnostic_v1.yaml, target: /inputs/protocol.yaml, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./config/m6_csi800_top30_compatibility_diagnostic_scope_v1.json, target: /inputs/release.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/control/m6_csi800_top30_compatibility_diagnostic_v1/approval.json, target: /inputs/approval.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/qlib_bin, target: /qlib, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/m6_csi800_model_attribution_v1/effect, target: /m6-effect, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/m6_csi800_topk20_conversion_v1/effect, target: /failed-effect, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/m6_csi800_top30_compatibility_diagnostic_v1/current, target: /diagnostic/current, read_only: false, bind: {create_host_path: false}}
    command: [python, -m, shaiwei.research.top30_diagnostic.runner, --lane, current, --protocol, /inputs/protocol.yaml, --release, /inputs/release.json, --approval, /inputs/approval.json, --provider-root, /qlib, --m6-effect-root, /m6-effect, --failed-effect-root, /failed-effect, --output-root, /diagnostic/current]

  m6-top30-diagnostic-auditor:
    image: shaiwei:m6-top30-diagnostic-current-v1
    pull_policy: never
    profiles: [m6-top30-diagnostic]
    init: true
    restart: "no"
    user: "${SHAIWEI_HOST_UID:-10001}:${SHAIWEI_HOST_GID:-10001}"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,size=512m,mode=1777]
    pids_limit: 64
    mem_limit: 2g
    cpus: 1.0
    environment: *runner_environment
    volumes:
      - {type: bind, source: ./config/m6_csi800_top30_compatibility_diagnostic_v1.yaml, target: /inputs/protocol.yaml, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./config/m6_csi800_top30_compatibility_diagnostic_scope_v1.json, target: /inputs/release.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/control/m6_csi800_top30_compatibility_diagnostic_v1/approval.json, target: /inputs/approval.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/m6_csi800_model_attribution_v1/effect/first_pass/W1/backtest/clean_lgbm_control_v1.parquet, target: /inputs/canonical.parquet, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/m6_csi800_top30_compatibility_diagnostic_v1/original, target: /diagnostic/original, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/m6_csi800_top30_compatibility_diagnostic_v1/current, target: /diagnostic/current, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/m6_csi800_top30_compatibility_diagnostic_v1/audit, target: /audit, read_only: false, bind: {create_host_path: false}}
    command: [python, -m, shaiwei.research.top30_diagnostic.audit, --protocol, /inputs/protocol.yaml, --release, /inputs/release.json, --approval, /inputs/approval.json, --canonical-report, /inputs/canonical.parquet, --original-root, /diagnostic/original, --current-root, /diagnostic/current, --audit-root, /audit]
