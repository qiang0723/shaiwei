x-runtime: &runtime
  image: shaiwei:m6-production-head30-audit-output-root-recovery-v1
  pull_policy: never
  profiles: [m6-production-head30-audit-output-root-recovery]
  init: true
  restart: "no"
  user: "${SHAIWEI_HOST_UID:-10001}:${SHAIWEI_HOST_GID:-10001}"
  read_only: true
  network_mode: none
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - "/tmp:rw,noexec,nosuid,size=1g,mode=1777"
  pids_limit: 128
  mem_limit: 4g
  cpus: 2.0
  environment:
    HOME: /tmp
    PYTHONPYCACHEPREFIX: /tmp/pycache
    OMP_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
    NUMEXPR_NUM_THREADS: "1"

