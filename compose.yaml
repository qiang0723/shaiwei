services:
  shaiwei:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    working_dir: /workspace
    env_file:
      - .env
    environment:
      SHAIWEI_DATA_ROOT: /workspace/data
      # Keep Codex on the macOS system proxy while data collectors leave the
      # container directly. Empty proxy variables override inherited settings;
      # NO_PROXY remains defense in depth for Docker Desktop proxy settings.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: &domestic_data_hosts "api.waditu.com,.waditu.com,finance.sina.com.cn,stock.finance.sina.com.cn,.sina.com.cn,.eastmoney.com,.baostock.com,localhost,127.0.0.1"
      no_proxy: *domestic_data_hosts
    volumes:
      - .:/workspace
    command: ["python", "-m", "shaiwei.pipeline.stage0", "--plan"]
