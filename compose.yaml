x-shaiwei-environment: &shaiwei_environment
  SHAIWEI_DATA_ROOT: /workspace/data
  SHAIWEI_LOCK_AUTHORITY: docker-named-volume-v1
  SHAIWEI_LOCK_ROOT: /run/shaiwei-locks
  # Keep Codex on the macOS system proxy while data collectors leave the
  # container directly. Empty proxy variables override inherited settings;
  # NO_PROXY remains defense in depth for Docker Desktop proxy settings.
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  all_proxy: ""
  NO_PROXY: &domestic_data_hosts "api.waditu.com,.waditu.com,finance.sina.com.cn,stock.finance.sina.com.cn,.sina.com.cn,.eastmoney.com,.baostock.com,localhost,127.0.0.1"
  no_proxy: *domestic_data_hosts

x-shaiwei-dev: &shaiwei_dev
  image: shaiwei:local
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  working_dir: /workspace
  env_file:
    - .env
  environment:
    <<: *shaiwei_environment
    # The development container intentionally consumes the current worktree.
    # Disable the image's embedded release manifest in this service only.
    SHAIWEI_RELEASE_MANIFEST: ""
  volumes:
    - .:/workspace
    - type: volume
      source: runtime-locks
      target: /run/shaiwei-locks
      volume:
        nocopy: true

services:
  shaiwei:
    <<: *shaiwei_dev
    command: ["python", "-m", "shaiwei.pipeline.stage0", "--plan"]

  scheduler:
    image: shaiwei:scheduler-current
    init: true
    working_dir: /workspace
    env_file:
      - .env
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      <<: *shaiwei_environment
      TZ: Asia/Shanghai
    # Production code/config/tests/templates are baked into the image.
    # Only explicit persistent runtime state may cross the host boundary.
    volumes:
      - type: bind
        source: ./data
        target: /workspace/data
        bind:
          create_host_path: false
      - type: bind
        source: ./ledger
        target: /workspace/ledger
        bind:
          create_host_path: false
      - type: bind
        source: ./logs
        target: /workspace/logs
        bind:
          create_host_path: false
      - type: volume
        source: runtime-locks
        target: /run/shaiwei-locks
        volume:
          nocopy: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g,mode=1777
      - /root/.cache:rw,noexec,nosuid,size=512m,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["python", "-m", "shaiwei.pipeline.scheduler"]
    healthcheck:
      test: ["CMD", "python", "-m", "shaiwei.pipeline.scheduler", "--healthcheck"]
      interval: 5m
      start_interval: 10s
      timeout: 15s
      retries: 3
      start_period: 2m

volumes:
  runtime-locks:
    name: shaiwei_runtime_locks_v1
