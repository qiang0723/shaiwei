x-rf-diag-base: &rf-diag-base
  image: shaiwei:rf-0b-gap-lineage-diagnostic-v1
  pull_policy: never
  init: true
  restart: "no"
  user: "${SHAIWEI_HOST_UID:-10001}:${SHAIWEI_HOST_GID:-10001}"
  working_dir: /workspace
  read_only: true
  network_mode: none
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  cpus: 4.0
  mem_limit: 10g
  environment:
    HOME: /tmp
    PYTHONPYCACHEPREFIX: /tmp/pycache
    OMP_NUM_THREADS: "2"
    OPENBLAS_NUM_THREADS: "2"
    MKL_NUM_THREADS: "2"
    NUMEXPR_NUM_THREADS: "2"
  tmpfs: ["/tmp:rw,noexec,nosuid,size=2g,mode=1777"]

services:
  rf-diag-fixture:
    <<: *rf-diag-base
    profiles: [rf-diag-fixture]
    build:
      context: .
      dockerfile: Dockerfile.ts-rf-diag
      network: none
      args:
        SHAIWEI_RELEASE_GIT_HEAD: ${SHAIWEI_RF_DIAG_RELEASE_GIT_HEAD:-}
    command: [python, -m, pytest, -q, tests/test_rf_diag_protocol.py, tests/test_rf_diag_engine.py]

  rf-diag-runner:
    <<: *rf-diag-base
    profiles: [rf-diag-live]
    volumes:
      - {type: bind, source: ./data/raw, target: /workspace/data/raw, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v3-data-gate-r3/input_manifest.json, target: /workspace/data/research/trend_swing/ts-v3-data-gate-r3/input_manifest.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/rf/rf-0b-field-identity-preflight-v1-r2, target: /workspace/data/research/rf/rf-0b-field-identity-preflight-v1-r2, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/rf/rf-0b-gap-lineage-diagnostic-v1, target: /workspace/data/research/rf/rf-0b-gap-lineage-diagnostic-v1, read_only: false, bind: {create_host_path: false}}
    command: [python, -m, shaiwei.research.rf_diag.cli, diagnose]

  rf-diag-auditor:
    <<: *rf-diag-base
    profiles: [rf-diag-live]
    volumes:
      - {type: bind, source: ./data/raw, target: /workspace/data/raw, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v3-data-gate-r3/input_manifest.json, target: /workspace/data/research/trend_swing/ts-v3-data-gate-r3/input_manifest.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/rf/rf-0b-field-identity-preflight-v1-r2, target: /workspace/data/research/rf/rf-0b-field-identity-preflight-v1-r2, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/rf/rf-0b-gap-lineage-diagnostic-v1, target: /workspace/data/research/rf/rf-0b-gap-lineage-diagnostic-v1, read_only: false, bind: {create_host_path: false}}
    command: [python, -m, shaiwei.research.rf_diag.cli, audit]
