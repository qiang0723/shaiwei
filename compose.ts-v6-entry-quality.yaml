x-ts-v6-base: &ts-v6-base
  image: shaiwei:ts-v6-entry-quality-preflight-v1
  pull_policy: never
  init: true
  restart: "no"
  user: "${SHAIWEI_HOST_UID:-10001}:${SHAIWEI_HOST_GID:-10001}"
  working_dir: /workspace
  read_only: true
  network_mode: none
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  cpus: 4.0
  mem_limit: 10g
  environment:
    HOME: /tmp
    PYTHONPYCACHEPREFIX: /tmp/pycache
    OMP_NUM_THREADS: "2"
    OPENBLAS_NUM_THREADS: "2"
    MKL_NUM_THREADS: "2"
    NUMEXPR_NUM_THREADS: "2"
  tmpfs: ["/tmp:rw,noexec,nosuid,size=1g,mode=1777"]

services:
  ts-v6-entry-quality-fixture:
    <<: *ts-v6-base
    profiles: [ts-v6-fixture]
    build:
      context: .
      dockerfile: Dockerfile.ts-v6-entry-quality
      network: none
      args:
        SHAIWEI_RELEASE_GIT_HEAD: ${SHAIWEI_TS_V6_RELEASE_GIT_HEAD:-}
    command: [python, -m, pytest, -q, tests/test_ts_v6_entry_quality_protocol.py, tests/test_ts_v6_entry_quality_engine.py]

  ts-v6-entry-quality-profile:
    <<: *ts-v6-base
    profiles: [ts-v6-live]
    volumes:
      - {type: bind, source: ./data/raw, target: /workspace/data/raw, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v3-data-gate-r3/input_manifest.json, target: /workspace/data/research/trend_swing/ts-v3-data-gate-r3/input_manifest.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3f-canary-001, target: /workspace/data/research/trend_swing/ts-v5-r3f-canary-001, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g-executable-semantics, target: /workspace/data/research/trend_swing/ts-v5-r3g-executable-semantics, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./ledger/ts_v5_r3f_llm_attempts.csv, target: /workspace/ledger/ts_v5_r3f_llm_attempts.csv, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./ledger/ts_v5_r3f_llm_transports.csv, target: /workspace/ledger/ts_v5_r3f_llm_transports.csv, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g1-recent-density-r2, target: /workspace/data/research/trend_swing/ts-v5-r3g1-recent-density-r2, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g3-discovery-diagnostic-v1-r2, target: /workspace/data/research/trend_swing/ts-v5-r3g3-discovery-diagnostic-v1-r2, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g3-discovery-diagnostic-v1-audit-r4, target: /workspace/data/research/trend_swing/ts-v5-r3g3-discovery-diagnostic-v1-audit-r4, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v6-entry-quality-preflight-v1, target: /workspace/data/research/trend_swing/ts-v6-entry-quality-preflight-v1, read_only: false, bind: {create_host_path: false}}
    command: [python, -m, shaiwei.research.trend_swing.v6.cli, profile]

  ts-v6-entry-quality-auditor:
    <<: *ts-v6-base
    profiles: [ts-v6-live]
    volumes:
      - {type: bind, source: ./data/research/trend_swing/ts-v3-data-gate-r3/input_manifest.json, target: /workspace/data/research/trend_swing/ts-v3-data-gate-r3/input_manifest.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g1-recent-density-r2, target: /workspace/data/research/trend_swing/ts-v5-r3g1-recent-density-r2, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g3-discovery-diagnostic-v1-r2, target: /workspace/data/research/trend_swing/ts-v5-r3g3-discovery-diagnostic-v1-r2, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g3-discovery-diagnostic-v1-audit-r4, target: /workspace/data/research/trend_swing/ts-v5-r3g3-discovery-diagnostic-v1-audit-r4, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v6-entry-quality-preflight-v1, target: /workspace/data/research/trend_swing/ts-v6-entry-quality-preflight-v1, read_only: false, bind: {create_host_path: false}}
    command: [python, -m, shaiwei.research.trend_swing.v6.cli, audit]
