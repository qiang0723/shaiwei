        source: ./data
        target: /workspace/data
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./data/research/trend_swing/ts-v3-data-gate-r3
        target: /workspace/data/research/trend_swing/ts-v3-data-gate-r3
        read_only: false
        bind: {create_host_path: false}
      - type: bind
        source: ./docs/TS_V3_DATA_GATE_RECOVERY_R3_RELEASE_V1.yaml
        target: /workspace/docs/TS_V3_DATA_GATE_RECOVERY_R3_RELEASE_V1.yaml
        read_only: true
        bind: {create_host_path: false}
    command: [python, -m, shaiwei.research.trend_swing.recovery_cli, audit]

  ts-r4-profile:
    <<: *ts-recovery-common
    image: shaiwei:ts-v3-pullback-r4
    profiles: [ts-r4-offline]
    build:
      context: .
