services:
  m6-head30-500k-feasibility-fixture:
    image: shaiwei:m6-head30-500k-feasibility-v1
    pull_policy: never
    profiles: [m6-head30-500k-feasibility]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SHAIWEI_RELEASE_GIT_HEAD: ${SHAIWEI_M6_HEAD30_500K_GIT_HEAD:-}
    init: true
    restart: "no"
    user: "${SHAIWEI_HOST_UID:-10001}:${SHAIWEI_HOST_GID:-10001}"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=256m,mode=1777"
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    environment:
      HOME: /tmp
      PYTHONPYCACHEPREFIX: /tmp/pycache
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    volumes:
      - type: bind
        source: ./data/research/m6_csi800_production_head30_500k_feasibility_v1/fixture
        target: /fixture
        read_only: false
        bind:
          create_host_path: false
    command:
      - python
      - -m
      - shaiwei.research.capital_feasibility.fixture
      - --output
      - /fixture/evidence.json
