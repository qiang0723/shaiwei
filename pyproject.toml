[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shaiwei"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "pandas>=2.2", "numpy>=1.26,<2.0", "duckdb>=1.0", "pyarrow>=16",
  "pandera>=0.20", "tushare>=1.4", "akshare",
  "lightgbm>=4.3", "pyqlib>=0.9.5",
  "joblib", "pyyaml", "pydantic>=2", "python-dotenv",
]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["shaiwei*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
