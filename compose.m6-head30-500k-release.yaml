services:
  m6-head30-500k-release-fixture:
    image: shaiwei:m6-head30-500k-release-v1
    pull_policy: never
    profiles: [m6-head30-500k-release]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SHAIWEI_RELEASE_GIT_HEAD: ${SHAIWEI_M6_HEAD30_500K_RELEASE_GIT_HEAD:-}
    init: true
    restart: "no"
    user: "${SHAIWEI_HOST_UID:-10001}:${SHAIWEI_HOST_GID:-10001}"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,size=512m,mode=1777]
    pids_limit: 64
    mem_limit: 1g
    cpus: 1.0
    environment: &safe_environment
      HOME: /tmp
      PYTHONPYCACHEPREFIX: /tmp/pycache
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    volumes:
      - {type: bind, source: ./data/research/m6_csi800_production_head30_500k_feasibility_v1/release-fixture, target: /fixture, read_only: false, bind: {create_host_path: false}}
    command: [python, -m, shaiwei.research.capital_feasibility.release_fixture, --output, /fixture/evidence.json]

  m6-head30-500k-release-runner:
    image: shaiwei:m6-head30-500k-release-v1
    pull_policy: never
    profiles: [m6-head30-500k-release]
    init: true
    restart: "no"
    user: "${SHAIWEI_HOST_UID:-10001}:${SHAIWEI_HOST_GID:-10001}"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,size=2g,mode=1777]
    pids_limit: 128
    mem_limit: 4g
    cpus: 2.0
    environment: *safe_environment
    volumes:
      - {type: bind, source: ./config/m6_csi800_production_head30_500k_release_scope_v1.json, target: /inputs/release.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/control/m6_csi800_production_head30_500k_feasibility_v1/approval.json, target: /inputs/approval.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/control/m6_csi800_production_head30_500k_feasibility_v1/raw-batch-manifest.json, target: /inputs/raw-batch-manifest.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/raw, target: /workspace/data/raw, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/m6_csi800_production_head30_v1/effect-r2, target: /inputs/r2, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/m6_csi800_production_head30_v1/effect-r2-audit-output-root-recovery/audit.json, target: /inputs/r7-audit.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/m6_csi800_production_head30_500k_feasibility_v1/effect, target: /outputs, read_only: false, bind: {create_host_path: false}}
    command: [python, -m, shaiwei.research.capital_feasibility.release_run, --release, /inputs/release.json, --approval, /inputs/approval.json, --r2-root, /inputs/r2, --r7-audit, /inputs/r7-audit.json, --raw-manifest, /inputs/raw-batch-manifest.json, --project-root, /workspace, --output-root, /outputs]

  m6-head30-500k-release-auditor:
    image: shaiwei:m6-head30-500k-release-v1
    pull_policy: never
    profiles: [m6-head30-500k-release]
    init: true
    restart: "no"
    user: "${SHAIWEI_HOST_UID:-10001}:${SHAIWEI_HOST_GID:-10001}"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,size=256m,mode=1777]
    pids_limit: 64
    mem_limit: 1g
    cpus: 1.0
    environment: *safe_environment
    volumes:
      - {type: bind, source: ./config/m6_csi800_production_head30_500k_release_scope_v1.json, target: /inputs/release.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/control/m6_csi800_production_head30_500k_feasibility_v1/approval.json, target: /inputs/approval.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/m6_csi800_production_head30_500k_feasibility_v1/effect, target: /outputs, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/m6_csi800_production_head30_500k_feasibility_v1/effect-audit, target: /audit, read_only: false, bind: {create_host_path: false}}
    command: [python, -m, shaiwei.research.capital_feasibility.release_audit, --release, /inputs/release.json, --approval, /inputs/approval.json, --effect-root, /outputs, --audit-root, /audit]
