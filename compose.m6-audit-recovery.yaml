services:
  m6-audit-recovery:
    image: shaiwei:m6-audit-entrypoint-recovery-v1
    pull_policy: never
    profiles: [m6-audit-recovery]
    build:
      context: .
      dockerfile: Dockerfile.m6-audit-recovery
      args:
        SHAIWEI_M6_AUDIT_RECOVERY_GIT_HEAD: ${SHAIWEI_M6_AUDIT_RECOVERY_GIT_HEAD:-}
    init: true
    restart: "no"
    user: "${SHAIWEI_HOST_UID:-10001}:${SHAIWEI_HOST_GID:-10001}"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g,mode=1777
    pids_limit: 256
    mem_limit: 4g
    cpus: 2.0
    environment:
      HOME: /tmp
      PYTHONPYCACHEPREFIX: /tmp/pycache
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    volumes:
      - type: bind
        source: ./config/m6_csi800_model_attribution_audit_entrypoint_recovery_v1.yaml
        target: /inputs/recovery-protocol.yaml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./config/m6_csi800_model_attribution_audit_recovery_scope_v1.json
        target: /inputs/recovery-release.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./data/control/m6_csi800_model_attribution_v1/audit-recovery-approval.json
        target: /inputs/recovery-approval.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./compose.m6-audit-recovery.yaml
        target: /inputs/recovery-compose.yaml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./config/m6_csi800_model_attribution_release_scope_v1.json
        target: /inputs/original-release.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./data/control/m6_csi800_model_attribution_v1/approval.json
        target: /inputs/original-approval.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./data/research/m6_csi800_model_attribution_v1/effect
        target: /outputs
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./data/research/m6_csi800_model_attribution_v1/effect-audit
        target: /audit
        read_only: false
        bind: {create_host_path: false}
    command:
      - python
      - /opt/shaiwei/m6-audit-recovery/entrypoint.py
      - --recovery-protocol
      - /inputs/recovery-protocol.yaml
      - --recovery-release
      - /inputs/recovery-release.json
      - --recovery-approval
      - /inputs/recovery-approval.json
      - --recovery-compose
      - /inputs/recovery-compose.yaml
      - --original-release
      - /inputs/original-release.json
      - --original-approval
      - /inputs/original-approval.json
      - --effect-root
      - /outputs
      - --audit-root
      - /audit
