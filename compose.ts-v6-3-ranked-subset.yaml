x-ts-v6-3-base: &ts-v6-3-base
  image: shaiwei:ts-v6-3-ranked-subset-effect-v1
  pull_policy: never
  init: true
  restart: "no"
  user: "${SHAIWEI_HOST_UID:-10001}:${SHAIWEI_HOST_GID:-10001}"
  working_dir: /workspace
  read_only: true
  network_mode: none
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  cpus: 6.0
  mem_limit: 14g
  environment:
    HOME: /tmp
    PYTHONPYCACHEPREFIX: /tmp/pycache
    OMP_NUM_THREADS: "6"
    OPENBLAS_NUM_THREADS: "6"
    MKL_NUM_THREADS: "6"
    NUMEXPR_NUM_THREADS: "6"
  tmpfs: ["/tmp:rw,noexec,nosuid,size=6g,mode=1777"]

services:
  ts-v6-3-effect-fixture:
    <<: *ts-v6-3-base
    profiles: [ts-v6-3-fixture]
    build:
      context: .
      dockerfile: Dockerfile.ts-v6-3-ranked-subset
      network: none
      args:
        SHAIWEI_RELEASE_GIT_HEAD: ${SHAIWEI_TS_V6_3_RELEASE_GIT_HEAD:-}
    command: [python, -m, pytest, -q, tests/test_ts_v6_3_ranked_effect_protocol.py, tests/test_ts_v6_3_ranked_effect_engine.py]

  ts-v6-3-effect-preflight:
    <<: *ts-v6-3-base
    profiles: [ts-v6-3-live]
    volumes:
      - {type: bind, source: ./data/raw, target: /workspace/data/raw, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v3-data-gate-r3/input_manifest.json, target: /workspace/data/research/trend_swing/ts-v3-data-gate-r3/input_manifest.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g-executable-semantics, target: /workspace/data/research/trend_swing/ts-v5-r3g-executable-semantics, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3f-canary-001, target: /workspace/data/research/trend_swing/ts-v5-r3f-canary-001, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./ledger/ts_v5_r3f_llm_attempts.csv, target: /workspace/ledger/ts_v5_r3f_llm_attempts.csv, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./ledger/ts_v5_r3f_llm_transports.csv, target: /workspace/ledger/ts_v5_r3f_llm_transports.csv, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g1-recent-density-r2, target: /workspace/data/research/trend_swing/ts-v5-r3g1-recent-density-r2, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g2-benchmark-lineage-v1, target: /workspace/data/research/trend_swing/ts-v5-r3g2-benchmark-lineage-v1, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/m6_csi800_model_attribution_v1/effect/first_pass, target: /workspace/data/research/m6_csi800_model_attribution_v1/effect/first_pass, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v6-1-entry-quality-ranking-preflight-v1, target: /workspace/data/research/trend_swing/ts-v6-1-entry-quality-ranking-preflight-v1, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g2-effect-entrypoint-recovery-v1/report.json, target: /workspace/data/research/trend_swing/ts-v5-r3g2-effect-entrypoint-recovery-v1/report.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v6-3-ranked-subset-effect-v1, target: /workspace/data/research/trend_swing/ts-v6-3-ranked-subset-effect-v1, read_only: false, bind: {create_host_path: false}}
    command: [python, -m, shaiwei.research.trend_swing.v6_3.cli, preflight]

  ts-v6-3-effect-runner:
    <<: *ts-v6-3-base
    profiles: [ts-v6-3-live]
    volumes:
      - {type: bind, source: ./data/raw, target: /workspace/data/raw, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v3-data-gate-r3/input_manifest.json, target: /workspace/data/research/trend_swing/ts-v3-data-gate-r3/input_manifest.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g-executable-semantics, target: /workspace/data/research/trend_swing/ts-v5-r3g-executable-semantics, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3f-canary-001, target: /workspace/data/research/trend_swing/ts-v5-r3f-canary-001, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./ledger/ts_v5_r3f_llm_attempts.csv, target: /workspace/ledger/ts_v5_r3f_llm_attempts.csv, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./ledger/ts_v5_r3f_llm_transports.csv, target: /workspace/ledger/ts_v5_r3f_llm_transports.csv, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g1-recent-density-r2, target: /workspace/data/research/trend_swing/ts-v5-r3g1-recent-density-r2, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g2-benchmark-lineage-v1, target: /workspace/data/research/trend_swing/ts-v5-r3g2-benchmark-lineage-v1, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/m6_csi800_model_attribution_v1/effect/first_pass, target: /workspace/data/research/m6_csi800_model_attribution_v1/effect/first_pass, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v6-1-entry-quality-ranking-preflight-v1, target: /workspace/data/research/trend_swing/ts-v6-1-entry-quality-ranking-preflight-v1, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g2-effect-entrypoint-recovery-v1/report.json, target: /workspace/data/research/trend_swing/ts-v5-r3g2-effect-entrypoint-recovery-v1/report.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g2-effect-entrypoint-recovery-v1/first_pass, target: /workspace/data/research/trend_swing/ts-v5-r3g2-effect-entrypoint-recovery-v1/first_pass, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v6-3-ranked-subset-effect-v1, target: /workspace/data/research/trend_swing/ts-v6-3-ranked-subset-effect-v1, read_only: false, bind: {create_host_path: false}}
    command: [python, -m, shaiwei.research.trend_swing.v6_3.cli, run]

  ts-v6-3-effect-auditor:
    <<: *ts-v6-3-base
    profiles: [ts-v6-3-live]
    volumes:
      - {type: bind, source: ./data/raw, target: /workspace/data/raw, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v3-data-gate-r3/input_manifest.json, target: /workspace/data/research/trend_swing/ts-v3-data-gate-r3/input_manifest.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g-executable-semantics, target: /workspace/data/research/trend_swing/ts-v5-r3g-executable-semantics, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3f-canary-001, target: /workspace/data/research/trend_swing/ts-v5-r3f-canary-001, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./ledger/ts_v5_r3f_llm_attempts.csv, target: /workspace/ledger/ts_v5_r3f_llm_attempts.csv, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./ledger/ts_v5_r3f_llm_transports.csv, target: /workspace/ledger/ts_v5_r3f_llm_transports.csv, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g1-recent-density-r2, target: /workspace/data/research/trend_swing/ts-v5-r3g1-recent-density-r2, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g2-benchmark-lineage-v1, target: /workspace/data/research/trend_swing/ts-v5-r3g2-benchmark-lineage-v1, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/m6_csi800_model_attribution_v1/effect/first_pass, target: /workspace/data/research/m6_csi800_model_attribution_v1/effect/first_pass, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v6-1-entry-quality-ranking-preflight-v1, target: /workspace/data/research/trend_swing/ts-v6-1-entry-quality-ranking-preflight-v1, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g2-effect-entrypoint-recovery-v1/report.json, target: /workspace/data/research/trend_swing/ts-v5-r3g2-effect-entrypoint-recovery-v1/report.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g2-effect-entrypoint-recovery-v1/first_pass, target: /workspace/data/research/trend_swing/ts-v5-r3g2-effect-entrypoint-recovery-v1/first_pass, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v6-3-ranked-subset-effect-v1, target: /workspace/data/research/trend_swing/ts-v6-3-ranked-subset-effect-v1, read_only: false, bind: {create_host_path: false}}
    command: [python, -m, shaiwei.research.trend_swing.v6_3.cli, audit]
