    profiles: [research-live]
    init: true
    user: "${SHAIWEI_HOST_UID:-10001}:${SHAIWEI_HOST_GID:-10001}"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g,mode=1777
    pids_limit: 256
    mem_limit: 6g
    cpus: 4.0
    environment:
      - DEEPSEEK_API_KEY
      - HOME=/tmp
      - MPLCONFIGDIR=/workspace/logs/matplotlib
      - PYTHONPYCACHEPREFIX=/tmp/pycache
    volumes:
