name: shaiwei-research

services:
  g8-primary-capture:
    image: shaiwei:g8-primary-capture-v1
    pull_policy: never
    profiles: [g8-primary-capture-live]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SHAIWEI_RELEASE_GIT_HEAD: ${SHAIWEI_G8_RELEASE_GIT_HEAD:-}
    init: true
    user: "${SHAIWEI_HOST_UID:-10001}:${SHAIWEI_HOST_GID:-10001}"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    environment:
      HOME: /tmp
      MPLCONFIGDIR: /tmp/matplotlib
      PYTHONPYCACHEPREFIX: /tmp/pycache
    volumes:
      - type: bind
        source: ./data
        target: /workspace/data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/g8/fund_evidence
        target: /workspace/data/g8/fund_evidence
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ./ledger
        target: /workspace/ledger
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./ledger/g8_fund_evidence.csv
        target: /workspace/ledger/g8_fund_evidence.csv
        read_only: false
        bind:
          create_host_path: false
    command:
      - python
      - -m
      - shaiwei.ingest.g8_fund_evidence
      - --protocol
      - /workspace/config/g8_fund_primary_capture_v1.yaml

  d1-fixture:
    image: shaiwei:d1-preexecution-v1
    pull_policy: never
    profiles: [research]
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    user: "10001:10001"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,mode=1777
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0
    environment:
      HOME: /tmp
      MPLCONFIGDIR: /tmp/matplotlib
      PYTHONPYCACHEPREFIX: /tmp/pycache
    volumes:
      - type: bind
        source: ./vendor/alphagen
        target: /workspace/vendor/alphagen
        read_only: true
        bind:
          create_host_path: false
    command:
      - python
      - -m
      - shaiwei.research.llm_factor
      - --fixture
      - --protocol
      - /workspace/config/d1_llm_factor_research_v1.yaml
      - --output-dir
      - /tmp/shaiwei-d1-fixture

  d1-live:
    image: shaiwei:d1-live-v1-r1
    pull_policy: never
    profiles: [research-live]
    init: true
    user: "${SHAIWEI_HOST_UID:-10001}:${SHAIWEI_HOST_GID:-10001}"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g,mode=1777
    pids_limit: 256
    mem_limit: 6g
    cpus: 4.0
    environment:
      - DEEPSEEK_API_KEY
      - HOME=/tmp
      - MPLCONFIGDIR=/workspace/logs/matplotlib
      - PYTHONPYCACHEPREFIX=/tmp/pycache
    volumes:
