services:
  rf-1-fixture:
    image: shaiwei:rf-1-fixture-v1
    pull_policy: never
    init: true
    restart: "no"
    user: "${SHAIWEI_HOST_UID:-10001}:${SHAIWEI_HOST_GID:-10001}"
    working_dir: /workspace
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    cpus: 4.0
    mem_limit: 10g
    environment:
      HOME: /tmp
      PYTHONPYCACHEPREFIX: /tmp/pycache
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    tmpfs: ["/tmp:rw,noexec,nosuid,size=1g,mode=1777"]
    profiles: [rf-1-fixture]
    build:
      context: .
      dockerfile: Dockerfile.ts-rf-1
      network: none
      args:
        SHAIWEI_RELEASE_GIT_HEAD: ${SHAIWEI_RF_1_RELEASE_GIT_HEAD:-}
    volumes:
      - {type: bind, source: ./data/research/rf/rf-0c-field-identity-preflight-v1-r2/identity_registry.json, target: /workspace/data/research/rf/rf-0c-field-identity-preflight-v1-r2/identity_registry.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./config/rf_0c_field_identity_preflight_v1.yaml, target: /workspace/config/rf_0c_field_identity_preflight_v1.yaml, read_only: true, bind: {create_host_path: false}}
    command: [python, -m, pytest, -q, tests/test_rf_1_protocol.py, tests/test_rf_1_engine.py]
