  covers: [discovery_2016_2018, W1_W6_2019_2024, style_shift_2017, microcap_crash_2024, volume_price_drawdown_2026h1]
  warmup_trading_days: 100
  warmup_before_qlib_calendar_start: report_only_count
  raw_fields: [trade_date, ts_code, open, high, low, close, pre_close, vol, amount, adj_factor, baostock_trade_status]
  qlib_features: [$open, $close, $high, $low, $volume, $vwap]
  industry: {source: tushare.index_member_all, level: L1, pit_rule: in_date_le_trade_date_and_out_date_null_or_ge_trade_date, known_limitation: vendor_classification_history_as_used_by_all_prior_project_research}
  label_clock: {entry: t_plus_1_open, exit: t_plus_11_open}
  allowed_outputs:
