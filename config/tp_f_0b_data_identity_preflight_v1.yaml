    - missing_or_invalid_field_counts_by_failure_class
    - suspension_counts_by_evidence_layer
    - corporate_action_adj_factor_change_day_counts
    - zero_volume_day_counts
    - limit_at_open_counts
    - exit_day_missing_open_counts
    - new_listing_and_warmup_buffer_day_counts
    - industry_unique_none_multiple_and_change_day_counts
    - index_entry_exit_counts
    - bse_row_count_must_be_zero
  forbidden_outputs:
    - any_candidate_value_or_score
    - any_feature_value_distribution
    - any_return_label_or_outcome

gates:
  raw_open_coverage_minimum: 0.99
  raw_prev_close_join_minimum: 0.99
  unclassified_missing_field_rows_maximum: 0
  bse_row_maximum: 0
  qlib_feature_non_missing_on_traded_member_days_minimum: 0.99
  sw_l1_unique_industry_minimum: 0.99
  next_day_open_exists_on_traded_member_days_minimum: 0.99
  report_only: [limit_up_or_down_at_open, exit_day_missing_open, warmup_buffer, industry_change_days, index_entry_exit]
  suspension_classification: rf_0c_two_layer_suspend_d_or_baostock_status_0
  threshold_change_after_profile: forbidden

identity_registry:
  sealed_base:
    path: data/research/rf/rf-0b-field-identity-preflight-v1-r2/identity_registry.json
    sha256: d3777d7a87fe308bdd003bf96d1d6e2f1f37f35369d619e70b92f19dad7c56b0
    reproduction_rule: exact_byte_equality_required
  extension_layers:
    public_factor_references:
      source: shaiwei.research.g1_calibration.controls.ROUTE_EXPRESSIONS
      routes: {R3: short_term_reversal_20d, R4: low_volatility_20d, R5: momentum_12_1}
    ts_v5_semantic_layer: {ledgers: [ts_v5, ts_v5_r2, ts_v5_r3c, ts_v5_r3f], attempts: 28, fields: [candidate_fingerprint, semantic_signature]}
    g1_v2_rejudge: same_21_definitions_no_new_identity
  joint_state_signature:
    price_features: [$open, $close, $high, $low, $vwap]
    anchor_operators: [Mean, EMA, WMA, Med, Max, Min]
    trend_component: price feature divided by or subtracted from an anchor operator of a price feature with window >= 20, or from Ref of a price feature with lag >= 20
    pullback_component_any_of:
      - price feature divided by or subtracted from an anchor operator of a price feature with 2 <= window <= 10 (Ref excluded)
      - volume contraction ratio between an anchor of $volume with a shorter window and $volume or an anchor of $volume with a longer window
      - close location value (close - low) / (high - low), epsilon additions ignored
    joint_state: at least one trend component and one pullback component in disjoint subtrees of one canonical expression
  census_outputs: [registry_counts, extension_counts, joint_state_counts_by_source]
  verdict_rule:
    alpha158_contains_joint_state_expression: REJECT_DUPLICATE
    llm_or_g1_identity_joint_state_hits: report_only_and_reference_for_formal_batch_dedup
  future_candidate_dedup_rule: canonical_ast_equality_or_semantic_equivalence_with_any_registry_or_extension_identity_is_reject
  forbidden_registry_content: [discovery_metrics, outcomes, admission_verdict_details]

