    - listing_shorter_than_warmup_window
    - zero_volume_day_vwap_undefined_classified
    - sw_l1_change_inside_window_and_none_or_multiple_industry
    - pre_membership_history_usable_membership_pit_at_signal_date
    - next_day_limit_up_at_open_counted
    - exit_day_missing_open_counted
    - joint_state_signature_positive_and_negative_cases
