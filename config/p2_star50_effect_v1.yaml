portfolio:
  account_rmb: 100000000
  topk: 10
  n_drop: 2
  rebalance_trade_days: 10
  deal_price: open
  weighting: equal_weight
  target_weight_per_name: 0.10
  maximum_single_name_weight: 0.10
  maximum_top3_weight: 0.30
  maximum_pit_sw_l1_industry_weight: 0.30
  minimum_valid_industry_coverage: 0.95
  liquidity_lookback_trade_days: 20
  minimum_valid_liquidity_days: 15
  minimum_median_daily_amount_rmb: 20000000
  maximum_order_to_median_daily_amount: 0.05
  insufficient_names_policy: keep_cash
  hard_ineligible_names_removed_before_rank_dropout: true
  ranking_dropout_limit_applies_after_hard_exclusions: 2

execution:
  feature_clock: signal_date_close
  execution_clock: next_official_trade_day_open
  signal_schedule_anchor: first_official_trade_day_in_each_evaluation_period
  pressure_periods_start_with_cash: true
  target_selection: greedy_score_descending_with_pit_industry_and_liquidity_constraints
  liquidity_observation_clock: signal_date_close
  order_capacity_policy: cap_partial_fill_to_five_percent_of_signal_date_median_amount
  suspended_policy: no_trade_keep_actual_position
  directional_limit_policy: no_trade_keep_actual_position
  st_policy: exclude_using_pit_name_state
  missing_price_policy: no_fill_for_signal_or_execution_and_no_trade
  suspended_valuation_policy: carry_last_observed_close_for_nav_only
  delisting_policy: fail_if_held_position_has_no_future_price_and_cash_realization_is_unmodeled
  star_price_limit_ratio: 0.195
  price_tick_tolerance: 0.01
  minimum_star_purchase_lot: 200
  additional_purchase_increment_shares: 1
  sell_remainder_allowed: true
  open_cost: 0.0006
  close_cost: 0.0016
  minimum_cost_rmb: 5
  cost_multipliers: [1.0, 1.5, 2.0]
  extra_slippage_each_side: 0.001
  benchmark_return: pct_chg_divided_by_100

model:
  feature_set: Alpha158
  label: "Ref($open,-11)/Ref($open,-1)-1"
  seed: 42
  learning_rate: 0.05
  num_leaves: 31
  max_depth: -1
  colsample_bytree: 0.8879
  subsample: 0.8789
  reg_alpha: 0.0421
  reg_lambda: 0.0220
  num_boost_round: 1000
  early_stopping_rounds: 50
  early_stopping_segment: valid
  num_threads: 1
  deterministic: true
  force_col_wise: true
  retrain_on_test_forbidden: true
  retune_forbidden: true

evaluation:
  windows:
    - name: STAR-W1
      train: ["2020-07-23", "2022-06-30"]
      valid: ["2022-07-01", "2022-12-31"]
      test: ["2023-01-01", "2023-12-31"]
    - name: STAR-W2
      train: ["2021-01-01", "2023-06-30"]
      valid: ["2023-07-01", "2023-12-31"]
      test: ["2024-01-01", "2024-12-31"]
    - name: STAR-W3
      train: ["2022-01-01", "2024-06-30"]
      valid: ["2024-07-01", "2024-12-31"]
      test: ["2025-01-01", "2025-12-31"]
  pressure_periods:
    - name: star_2023_drawdown
      start: "2023-08-28"
      end: "2023-10-23"
      frozen_model_window: STAR-W1
    - name: microcap_2024
      start: "2024-01-02"
      end: "2024-02-08"
      frozen_model_window: STAR-W2
    - name: volume_price_2026h1
      start: "2026-01-01"
      end: "2026-06-30"
      frozen_model_window: STAR-W3
  pooled_base_definition: chronological_concatenation_2023_2024_2025_compound_strategy_minus_compound_benchmark
  minimum_test_trade_days_per_window: 220
  minimum_rebalances_per_window: 20
  minimum_positive_net_excess_windows: 2
  require_pooled_base_net_excess_positive: true
  require_pooled_double_cost_net_excess_nonnegative: true
  require_pooled_extra_slippage_net_excess_nonnegative: true
  maximum_test_or_pressure_strategy_nav_drawdown: 0.20
  minimum_forward_trade_days_before_production_review: 252
  minimum_forward_rebalances_before_production_review: 20

diversification_gate:
  comparator_inventory: config/p2_star50_csi800_comparator_inventory_v1.json
  comparator_inventory_sha256: a1c940272bc94aeec9b85a9d35b4148fac3548f0da563a3d660b15ad8d825002
  bound_comparator: null
  missing_comparator_policy: NOT_EVALUABLE_AND_NO_GO
  temporary_proxy_forbidden: true
  weighted_name_overlap:
    definition: daily_sum_minimum_star_and_csi_name_weights
    aggregation: maximum_over_common_trade_days
    maximum: 0.35
  return_correlation:
    return_field: base_cost_daily_net_return
    period: ["2023-01-01", "2025-12-31"]
    minimum_common_trade_days: 660
    method: pearson
    maximum: 0.80
  joint_risk_contribution:
    csi800_capital_weight: 0.75
    star50_capital_weight: 0.25
    definition: "w_star*(Sigma*w)_star/(w_prime*Sigma*w)"
    maximum: 0.25
    nonfinite_or_nonpositive_denominator_policy: fail_closed

diagnostics:
  allowed: [RankIC, ICIR, turnover, industry_exposure, capacity_utilization]
  may_create_post_hoc_gate: false

verdict_contract:
  strategy_results_inspected: true
  go_requires:
    - all_three_windows_minimum_observations
    - all_three_windows_minimum_rebalances
    - at_least_two_positive_base_net_excess_windows
    - pooled_base_net_excess_positive
    - pooled_double_cost_net_excess_nonnegative
    - pooled_extra_slippage_net_excess_nonnegative
    - every_test_and_pressure_drawdown_at_or_below_maximum
    - diversification_gate_pass
    - determinism_pass
  historical_go_effective_label: HISTORICAL_GO_FOR_FORWARD_ONLY
  reject_effective_label: REJECT
  not_evaluable_effect_gate: NO_GO
  production_authorization: none

prohibited_actions:
  - threshold_change_after_result
  - seed_change
  - test_driven_retrain
  - comparator_proxy_creation
  - production_signal_generation
  - paper_portfolio_change
  - csi800_provider_model_signal_or_gate_change
  - shared_or_forward_qlib_change
  - scheduler_image_or_config_change
  - production_ledger_change
  - automatic_forward_or_production_authorization
