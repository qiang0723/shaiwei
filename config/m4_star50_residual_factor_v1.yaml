  ols_residual_includes_alpha_for_idiosyncratic_volatility: true
  deterministic_float_precision: float64

candidates:
  - candidate_id: residual_momentum_35_skip5
    formula: sum(beta_adjusted_return_oldest_35) / ols_residual_std_40
    orientation: higher_is_hypothesized_better
    mechanism: firm_specific_intermediate_return_persistence
  - candidate_id: residual_reversal_5
    formula: -sum(beta_adjusted_return_latest_5) / ols_residual_std_40
    orientation: higher_is_hypothesized_better
    mechanism: correction_of_recent_firm_specific_price_pressure
  - candidate_id: negative_idiosyncratic_volatility_40
    formula: -ols_residual_std_40
    orientation: higher_is_hypothesized_better
    mechanism: low_idiosyncratic_volatility

