  recovery_confirmation:
    parent_close_reclaims_frozen_breakout_reference_required: true
    recovery_close_location: adjusted_close_minus_adjusted_low_divided_by_adjusted_high_minus_adjusted_low
    zero_or_negative_adjusted_range_policy: fail_closed
    minimum_recovery_close_location_parameter: true
    pre_entry_10d_return: adjusted_close_divided_by_lagged_10d_adjusted_close_minus_one
    same_day_pit_csi800_cross_sectional_percentile: true
    maximum_pre_entry_10d_return_percentile_parameter: true
  sector_strength_gate: exact_inherited_not_parameterized
  parameter_axes:
