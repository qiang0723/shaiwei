candidate_policy:
  - candidate: fundamental_net_income_to_assets_v2
    formula: n_income_attr_p / total_assets
    pre_registered_direction: 1
    rationale: 盈利相对资产越高，单位资产创造股东利润的能力越强。
  - candidate: fundamental_operating_margin_v2
    formula: operate_profit / total_revenue
    pre_registered_direction: 1
    rationale: 营业利润率越高，主营业务定价能力和经营效率通常越强。
  - candidate: fundamental_cash_return_on_assets_v2
    formula: n_cashflow_act / total_assets
    pre_registered_direction: 1
    rationale: 经营现金流相对资产越高，盈利兑现质量和内部造血能力越强。
  - candidate: fundamental_leverage_v2
    formula: total_liab / total_assets
    pre_registered_direction: -1
    rationale: 在其他条件相同时，较低杠杆通常意味着更低偿债压力和尾部风险。
  - candidate: fundamental_cash_to_assets_v2
    formula: money_cap / total_assets
    pre_registered_direction: 1
    rationale: 现金资产占比更高通常提供更强流动性缓冲和逆周期选择权。
  - candidate: fundamental_accruals_to_assets_v2
    formula: (n_income_attr_p - n_cashflow_act) / total_assets
    pre_registered_direction: -1
    rationale: 较低应计利润意味着利润更受现金流支撑，盈余质量通常更高。

