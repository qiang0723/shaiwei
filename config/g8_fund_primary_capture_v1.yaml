acceptance:
  nav_evidence_rows: 6
  dividend_evidence_rows: 48
  ledger_rows: 54
  usable_nav_rows: 48
  duplicate_product_dates_maximum: 0
  double_fetch_mismatches_maximum: 0
  http_failures_maximum: 0
  schema_failures_maximum: 0
  revision_conflicts_maximum: 0
  bundle_hash_failures_maximum: 0
