protocol_id: g8-fund-primary-capture-v1
schema_version: g8-primary-capture-v1
status: RESULT_BEFORE_EXECUTION_FROZEN
frozen_at: "2026-07-26"
timezone: Asia/Shanghai
execution_authorized: true
production_authorization: none

source_feasibility_binding:
  protocol_path: config/g8_fund_evidence_source_v1.yaml
  protocol_sha256: 9608a979519eaefec1d7836c699baaa24f507c011848ec9b2d6eb9c172918f5c
  prior_verdict: GO_G8_1_PRIMARY_CAPTURE_ONLY
  g8_status_before_capture: NOT_READY

scope:
  capture_start: "2026-07-15"
  capture_end: "2026-07-24"
  product_count: 6
  expected_nav_requests: 6
  expected_usable_nav_rows: 48
  expected_dividend_requests: 48
  expected_logical_requests: 54
  expected_http_observations: 108
  strategy_results_access: false
  g8_evaluation: false
  total_return_construction: false
  manager_https_crosscheck: false
  fee_document_collection: false
  scheduler_integration: false
  web_changes: false

source:
  role: statutory_central_disclosure_primary
  scheme: http
  host: eid.csrc.gov.cn
  port: 80
  origin: http://eid.csrc.gov.cn
  authenticated_transport: false
  trust_environment_proxy: false
  request_timeout_seconds: 30
  minimum_request_start_interval_seconds: 0.5
  automatic_retries: 0
  allowed_paths:
    - /fund/disclose/getPublicFundJZInfoMore.do
    - /fund/disclose/getDividendInfo.do
  forbidden_authority:
    - aggregation_site
    - current_fee_backfill
    - inferred_dividend

nav_request:
  method: GET
  path: /fund/disclose/getPublicFundJZInfoMore.do
  query_parameter: aoData
  ao_data_order:
    - [sEcho, 1]
    - [iDisplayStart, 0]
    - [iDisplayLength, 100]
    - [fundType, all]
    - [fundCompanyShortName, ""]
    - [fundCode, PRODUCT_CODE]
    - [fundName, ""]
    - [startDate, CAPTURE_START]
    - [endDate, CAPTURE_END]
  response_container: aaData
  usable_row:
    classification_code: 2030-1010
    code_equals_product: true
    short_name_equals_expected: true
    share_net_value_nonempty_decimal: true
    total_net_value_nonempty_decimal: true
    valuation_date_within_capture_window: true
    fund_id_equals_frozen_identity: true
    upload_detail_id_positive_integer: true
  ignored_master_row:
    classification_code: 2030-1030
    share_net_value_empty: true
    total_net_value_empty: true
    exact_one_per_usable_valuation_date: true
  expected_usable_rows_per_product: 8
  unknown_or_duplicate_row_action: fail_closed

dividend_request:
  method: POST
  path: /fund/disclose/getDividendInfo.do
  one_request_per_usable_nav_row: true
  form_mapping:
    uploadDetailId: NAV_ROW_UPLOAD_DETAIL_ID
    fundName: EXPECTED_PRODUCT_NAME
    fundCode: PRODUCT_CODE
    thisLevel: "1"
    thisName: EXPECTED_PRODUCT_NAME
    thisCode: PRODUCT_CODE
  response_identity_must_match_request: true
  required_fields:
    - fundCode
    - fundName
    - isFenji
    - specialPoint.fenhongjinE
    - specialPoint.changwai
    - specialPoint.changnei
    - specialPoint.remark
    - specialPoint.specialPoint
  empty_special_point_is_valid_evidence: true
  dividend_inference_from_nav_change: false

double_fetch:
  observations_per_logical_request: 2
  compare: exact_response_body_bytes
  required_http_status: 200
  mismatch_action: persist_quarantine_and_fail
  schema_failure_action: persist_quarantine_and_fail
  prior_same_request_new_content_action: persist_revision_quarantine_and_fail
  identical_existing_content_action: verify_and_reuse_without_append

storage:
  data_root: data/g8/fund_evidence
  bundle_directory: data/g8/fund_evidence/bundles
  bundle_schema: g8-primary-evidence-bundle-v1
  bundle_body_encoding: base64
  observations_preserved: 2
  response_headers_allowlist:
    - date
    - content-type
    - content-length
    - last-modified
    - etag
    - server
    - cache-control
    - expires
    - content-encoding
    - transfer-encoding
  response_headers_forbidden:
    - set-cookie
    - authorization
    - proxy-authenticate
  overwrite_existing_bundle: false
  ledger_path: ledger/g8_fund_evidence.csv
  ledger_append_only: true
  raw_or_parsed_values_in_tracked_ledger: false
  absolute_paths_in_tracked_ledger: false

