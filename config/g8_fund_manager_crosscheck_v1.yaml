nav_crosscheck:
  required_dates:
    - "2026-07-15"
    - "2026-07-16"
    - "2026-07-17"
    - "2026-07-20"
    - "2026-07-21"
    - "2026-07-22"
    - "2026-07-23"
    - "2026-07-24"
  identity_fields: [product_code, expected_name, share_class]
  value_fields: [unit_nav, cumulative_nav]
  decimal_comparison: exact_numeric_value
  one_row_per_product_date: true
  unknown_or_duplicate_row_action: fail_closed
  missing_date_action: fail_closed
  manager_primary_conflict_action: persist_quarantine_and_fail
  product_name_or_code_conflict_action: persist_quarantine_and_fail
  mutable_manager_page_role: authenticated_crosscheck_only

fee_lineage:
  fee_types: [subscription, redemption]
  share_class: A
  standard_schedule_only: true
  channel_discount_assumption: forbidden
  current_mutable_page_role: current_schedule_crosscheck_only
  legal_authority_documents:
    - fund_contract
    - prospectus
    - product_summary
    - fee_change_manager_notice
  required_coverage:
    lineage_start: fund_inception
    lineage_end: "2026-07-26"
    latest_pre_comparator_freeze_anchor_required: true
    all_fee_change_notices_after_anchor_required: true
    explicit_publication_date_required: true
    explicit_effective_date_required_for_change: true
  extracted_row_fields:
    - product_code
    - share_class
    - fee_type
    - amount_or_holding_lower_bound
    - amount_or_holding_upper_bound
    - lower_bound_inclusive
    - upper_bound_inclusive
    - rate_or_fixed_amount
    - currency
    - effective_from
    - effective_to
    - source_document_sha256
    - source_page_or_section
  forbidden:
    - current_fee_backfill
    - infer_effective_date_from_download_time
    - infer_no_change_from_missing_search_result
    - treat_sales_platform_discount_as_statutory_base_fee
    - overwrite_prior_document_or_fee_row

