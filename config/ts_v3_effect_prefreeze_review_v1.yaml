pre_effect_findings:
  - finding_id: MISSING_PULLBACK_TOUCHED_STATE
    severity: BLOCKING
    evidence: >-
      The R3 candidate predicate requires market, sector, size, weekly liquidity, monthly highs,
      non-decreasing weekly lows, weekly close strength and a recovery candle, but it does not
      require an earlier or same-day pullback touch within the frozen weekly plan.
    impact: >-
      The 832 R3 rows are recovery-shape candidates, not proven pullback-then-recovery events.
      Treating them as the authoritative TS v3 sample would silently change the strategy into
      a momentum-entry strategy.
  - finding_id: EFFECT_SAMPLE_DENOMINATOR_NOT_YET_VALID
    severity: BLOCKING
    evidence:
      r3_recovery_shape_events_all_dates: 832
      r3_recovery_shape_events_in_frozen_oos_span_2019_2024: 414
      oos_recovery_shape_events_with_positive_stop_distance_below_15pct: 154
      authoritative_pullback_then_recovery_event_count: NOT_EVALUATED
    impact: >-
      The 154-row result-blind subset is only an upper-bound screening count and cannot support
      a frozen minimum-trade gate.
  - finding_id: PRIMARY_TOTAL_RETURN_BENCHMARK_NOT_BOUND
    severity: BLOCKING_BEFORE_REAL_EFFECT
    evidence: >-
      The R3 input manifest contains the CSI800 price index 000906.SH but does not bind the
      H00906 total-return series required by the TS baseline.
    impact: >-
      A real effect run must fail closed instead of substituting the price index or constructing
      an undocumented proxy.
  - finding_id: V3_EXIT_SEMANTICS_CONFLICT
    severity: MUST_RESOLVE_BEFORE_FREEZE
    evidence: >-
      The v3 direction requires the previous-complete-week-low-times-0.98 structural stop and a
      stop that may only ratchet upward after another complete week, while the retained v2.1
      section describes a fixed ATR-based stop.
    impact: >-
      A single v3 exit state machine must supersede the historical v2.1 execution text before
      synthetic engineering.

