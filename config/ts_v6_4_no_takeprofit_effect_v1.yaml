objective:
  primary: >-
    determine_whether_removing_the_fixed_take_profit_and_letting_the_structural_weekly_low_ratchet
    plus the day_15_time_exit_decide_exits_changes_the_parent_discovery_economics_with_identical
    entry_sizing_and_execution_semantics
  single_variable_vs_parent: fixed_take_profit_mechanism_removed_no_other_change
  hypothesis_economic_logic: >-
    trend_following_requires_right_tail_capture; a fixed 1.5r take_profit converts potential
    larger winners into capped exits while losses continue to the full structural stop, which at
    the parent win rate cannot deliver positive expectancy; this is a mechanism deletion chosen
    from the trend literature already cited in ts_0, not a threshold tuned from parent outcomes
  forbidden_derivation: tuning_any_take_profit_multiple_or_time_exit_length_from_observed_results
  historical_result_only: true
  downstream_decision: reject_and_close_lane_or_authorize_drafting_holdout_protocol_with_new_budget_decision
  direct_paper_or_production_decision: forbidden

