decision_contract:
  precedence: [BLOCKED, VALIDATED_RESEARCH_SCALE, REJECTED_RESEARCH_SCALE]
  VALIDATED_RESEARCH_SCALE: >-
    treatment在六窗口直接通过未改动G0；只说明生产转换规则在1亿元研究尺度获得历史支持，不代表
    50万元可执行、真实前瞻成熟或生产可切换。
  REJECTED_RESEARCH_SCALE: >-
    treatment未通过未改动G0；生产转换规则缺少历史支持，现有自然模拟记录继续作为观察证据但不得
    被表述为已验证策略。
  BLOCKED: 输入身份、执行语义、确定性、账本或独立审计任一不完整。
  production_authorization_for_every_outcome: none

