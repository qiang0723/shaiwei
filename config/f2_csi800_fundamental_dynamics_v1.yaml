point_in_time:
  annual_period_suffix: "1231"
  allowed_report_types: ["1", "5"]
  availability: first_open_day_strictly_after_f_ann_date
  same_period_revision: latest_available_f_ann_date
  same_announcement_report_priority: ["1", "5"]
  same_announcement_update_priority: descending
  statement_join: exact_ts_code_and_end_date_before_period_selection
  pair_selection: latest_jointly_available_consecutive_common_annual_pair
  predecessor_period: exact_same_month_day_one_calendar_year_earlier
  combined_feature_available_date: latest_of_all_current_and_predecessor_components
  newer_unpaired_period_policy: diagnose_without_invalidating_prior_consecutive_pair
  current_components_cannot_mix_periods: true
  predecessor_components_cannot_mix_periods: true
  current_and_predecessor_must_be_exactly_one_year_apart: true
  fina_indicator_forbidden: true

features:
  - feature_id: fundamental_asset_growth_v1
    formula: total_assets_t / total_assets_t_minus_1 - 1
    inputs: [balancesheet.total_assets_t, balancesheet.total_assets_t_minus_1]
    expected_direction: -1
    rationale: 资产扩张过快通常伴随投资效率下降和后续收益回落风险。
  - feature_id: fundamental_revenue_growth_v1
    formula: total_revenue_t / total_revenue_t_minus_1 - 1
    inputs: [income.total_revenue_t, income.total_revenue_t_minus_1]
    expected_direction: 1
    rationale: 可比年度收入增长反映经营规模扩张和需求动能。
  - feature_id: fundamental_operating_profit_change_v1
    formula: (operate_profit_t - operate_profit_t_minus_1) / average_total_assets
    inputs: [income.operate_profit_t, income.operate_profit_t_minus_1, balancesheet.total_assets_t, balancesheet.total_assets_t_minus_1]
    expected_direction: 1
    rationale: 营业利润相对资产基数改善反映主营经营动能增强。
  - feature_id: fundamental_net_income_change_v1
    formula: (n_income_attr_p_t - n_income_attr_p_t_minus_1) / average_total_assets
    inputs: [income.n_income_attr_p_t, income.n_income_attr_p_t_minus_1, balancesheet.total_assets_t, balancesheet.total_assets_t_minus_1]
    expected_direction: 1
    rationale: 归母净利润相对资产基数改善反映股东盈利动能增强。
  - feature_id: fundamental_operating_cashflow_change_v1
    formula: (n_cashflow_act_t - n_cashflow_act_t_minus_1) / average_total_assets
    inputs: [cashflow.n_cashflow_act_t, cashflow.n_cashflow_act_t_minus_1, balancesheet.total_assets_t, balancesheet.total_assets_t_minus_1]
    expected_direction: 1
    rationale: 经营现金流相对资产基数改善反映内部造血动能增强。
  - feature_id: fundamental_cash_balance_change_v1
    formula: (money_cap_t - money_cap_t_minus_1) / average_total_assets
    inputs: [balancesheet.money_cap_t, balancesheet.money_cap_t_minus_1, balancesheet.total_assets_t, balancesheet.total_assets_t_minus_1]
    expected_direction: 1
    rationale: 现金余额相对资产基数改善反映流动性缓冲正在增强。

denominator_policy:
