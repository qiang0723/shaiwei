  strategy_results_inspected: false
  g8_verdict_status: NOT_READY
  production_authorization: none

regulatory_basis:
  disclosure_rule_url: https://www.csrc.gov.cn/csrc/c106256/c1653985/content.shtml
  xbrl_rule_url: https://www.csrc.gov.cn/csrc/c101877/c1029609/content.shtml
  electronic_disclosure_site_rule_url: https://fg.amac.org.cn/governmentrules_3854/zcgz_gfxwj/gfxwj_gmjj/gfxwj_gmjj_xxpl/201912/t20191222_24759.html
  open_fund_nav_deadline: no_later_than_next_day_after_each_open_day
  subscription_redemption_fee_source: fund_contract_prospectus_or_product_summary

primary_source:
  role: statutory_central_disclosure_primary
  origin: http://eid.csrc.gov.cn
  homepage_path: /fund/disclose/index.html
  official_url_is_http: true
  http_probe_status: PASS
  https_probe_status: FAIL_TLS
  authenticated_transport: false
  source_can_be_verified_without_crosscheck: false
  aggregation_sites_authoritative: false

nav_contract:
  method: GET
  path: /fund/disclose/getPublicFundJZInfoMore.do
  request_parameter: aoData
  fixed_filters:
    fundType: all
    fundCompanyShortName: ""
    fundName: ""
    iDisplayStart: 0
    iDisplayLength: 100
  variable_filters: [fundCode, startDate, endDate]
  usable_row:
    code_matches_request: true
    classification_code: 2030-1010
    share_net_value_nonempty: true
    total_net_value_nonempty: true
    valuation_date_in_requested_range: true
    exact_usable_rows_per_code_date: 1
  observed_rows_per_code_date: 2
  observed_empty_master_row: true
  forbidden:
    - use_empty_master_row
    - forward_fill_missing_nav
    - infer_dividend_from_nav_drop
    - overwrite_prior_capture
    - use_aggregation_site_as_authority

dividend_contract:
  method: POST
  path: /fund/disclose/getDividendInfo.do
  identity_fields:
    - uploadDetailId
    - fundName
    - fundCode
    - thisLevel
    - thisName
    - thisCode
  response_fields:
    - fundCode
    - fundName
    - isFenji
    - specialPoint.fenhongjinE
    - specialPoint.changwai
    - specialPoint.changnei
    - specialPoint.remark
    - specialPoint.specialPoint
  empty_special_point_is_valid_no_event_evidence: true
  dividend_event_occurrence_proven_by_probe: false

legal_document_contract:
  fund_detail_path_template: /fund/disclose/fund_detail.do?fundId={fund_id}
  required_sections:
    - product_summary
    - prospectus
    - daily_nav
    - manager_notice
  fee_effective_timeline_status: NOT_IMPLEMENTED
  document_download_and_hash_status: NOT_IMPLEMENTED
  manual_fee_record_requires_source_document_sha256: true
  manual_fee_record_requires_effective_date: true

