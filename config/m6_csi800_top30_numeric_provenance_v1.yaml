classification_contract:
  ROOT_CAUSE_IDENTIFIED: >-
    既有证据形成唯一、无竞争解释的生产谱系差异，并且该差异与现有三路输出关系逐项一致；
    不得仅凭版本不同或相关性判定。
  PRODUCER_ENVIRONMENT_IDENTIFIED_NOT_CAUSALLY_PROVEN: >-
    规范日报的完整生产环境可被内容寻址，但现有零新回测证据不足以证明某一差异就是因果来源。
  PROVENANCE_GAP_CONFIRMED: >-
    规范日报缺少至少一个不可替代的生产身份，现有镜像、提交或元数据不能闭合，因而无法继续归因。
