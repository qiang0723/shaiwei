candidate_policy:
  - candidate: fundamental_asset_growth_v1
    formula: total_assets_t / total_assets_t_minus_1 - 1
    pre_registered_direction: -1
    expression_tokens: 5
    ast_nodes: 5
    rationale: 资产扩张过快常伴随投资效率下降、融资约束和后续盈利稀释，较低资产增长通常更稳健。
  - candidate: fundamental_revenue_growth_v1
    formula: total_revenue_t / total_revenue_t_minus_1 - 1
    pre_registered_direction: 1
    expression_tokens: 5
    ast_nodes: 5
    rationale: 营业收入持续增长通常反映需求扩张、市场份额提升或业务规模增长。
  - candidate: fundamental_operating_profit_change_v1
    formula: (operate_profit_t - operate_profit_t_minus_1) / average_total_assets
    pre_registered_direction: 1
    expression_tokens: 9
    ast_nodes: 9
    rationale: 营业利润相对平均资产的改善衡量主营经营成果的增量效率，改善通常对应更强基本面。
  - candidate: fundamental_net_income_change_v1
    formula: (n_income_attr_p_t - n_income_attr_p_t_minus_1) / average_total_assets
    pre_registered_direction: 1
    expression_tokens: 9
    ast_nodes: 9
    rationale: 归母净利润相对平均资产的增长衡量股东盈利能力的年度改善，改善通常具有正向含义。
  - candidate: fundamental_operating_cashflow_change_v1
    formula: (n_cashflow_act_t - n_cashflow_act_t_minus_1) / average_total_assets
    pre_registered_direction: 1
    expression_tokens: 9
    ast_nodes: 9
    rationale: 经营现金流相对平均资产的改善反映盈利兑现与内部造血能力增强。
  - candidate: fundamental_cash_balance_change_v1
    formula: (money_cap_t - money_cap_t_minus_1) / average_total_assets
    pre_registered_direction: 1
    expression_tokens: 9
    ast_nodes: 9
    rationale: 货币资金相对平均资产的增长通常提高流动性缓冲和逆周期选择权，但仍须由增量效果门验证。

