  global_failure_mode:
    outcome_kind: GLOBAL_DATA_FAILURE
    required_files: [source_conflict_report.json, data_gate_report.json, run_manifest.json]
    forbidden_files: [feature_panel.parquet]
    feature_panel_status: NOT_CREATED_GLOBAL_FAILURE
    computation_status: NOT_COMPUTED_GLOBAL_FAILURE
    verdict: NO_GO_M5_2_DATA_PREEXECUTION
