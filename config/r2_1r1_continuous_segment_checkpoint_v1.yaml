segment:
  definition: maximal run of consecutive official SSE open days ending at as_of in which every day is live_dual
  reset_on:
    - official_open_day_not_live_dual
    - account_policy_sha256_change
    - code_snapshot_sha256_differs_from_previous_live_dual_day
  code_change_day_starts_new_segment_if_live_dual: true
  gap_is_blocking: false
  disclose_all_gaps_and_reset_count: true

rebalance_cycle_predicate:
  - matched_shadow_signal_rebalance_due_true
  - day_is_live_dual_inside_segment
  - order_and_fill_counts_reported_even_when_zero

anchor:
  rule: last_common_PASS_state_of_both_accounts_before_segment_first_day
  anchor_is_observation: false
  anchor_stratum_always_disclosed: true

gate:
  minimum_segment_live_dual_days: 20
  minimum_segment_rebalance_cycles: 2
  latch_on_first_reach: true
  descriptive_report: single_write_once
  later_gaps_revoke_latch: false

terminal_states:
  NOT_DUE: current_segment_below_gate
  BLOCKED_EVIDENCE: contract_failure_identity_calendar_replay_or_accounting
  OBSERVED_WITH_EXECUTION_WARN: gate_reached_with_nonfatal_execution_or_notification_warning
  CHECKPOINT_OBSERVED: gate_reached

progress_outputs_counts_only: [segment_first_day, segment_live_dual_days, segment_rebalance_cycles, segment_code_snapshot, gap_days, reset_count, next_official_open_day, latch_status]
descriptive_outputs_at_latch_only:
