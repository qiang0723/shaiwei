production_authorization: none

objective:
  strategy_family: TS
  candidate_id: TS6_1_HEALTHY_RETEST_ENTRY_QUALITY_RANKING_V1
  primary_question: >-
    whether a continuous entry-quality score with a frozen retention fraction can select a dense,
    dispersed, year-stable strict subset of the rejected TS-v5 R3G-2 parent event population,
    replacing the multiplicative three-hard-gate design of the stopped TS-v6-0 preflight, without
    reading any post-entry outcome and without reading any new market data
  downstream_decision: freeze_at_most_one_ranked_candidate_subset_for_a_separate_effect_protocol
  strategy_effect_evaluation: false

user_rulings_20260818:
  ruling_boundary: >-
    zero-effect nodes may compare only populations, densities, and result-blind feature
    distributions; any outcome-conditional analysis (including post-hoc comparison of already
    unsealed discovery outcome groups) is forbidden and would count as a real effect read
  ruling_ts_lane_effect_budget:
    remaining_independent_effect_protocols: 2
    exhaustion_consequence: authoritative_ts_lane_closure_with_evidence_preserved
  ruling_trigger_population_redefinition: >-
    MOOT. The R3G-1 result-blind density profile (bound below) already evaluated all six frozen
    entry mechanisms; only BREAKOUT_RETEST passed the frozen density gate. The five alternative
    mechanisms reach at most 17 legal discovery events against a gate of 30, so no legal
    alternative trigger population exists. The ranking direction named by the TS-v6-0 acceptance
    is the only density-viable successor.
  ruling_effect_gate_values: >-
    deferred to the separate effect protocol; advisory baselines recorded here are the R3G-2
    main-point pre-fee per-trade expectancy of -88.80 RMB and a discovery density target of at
    least 150 events per three years for any future brand-new trigger population

