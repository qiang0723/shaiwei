  exit_rules_changed: false
  sizing_or_risk_rules_changed: false

entry_quality_ranking_mechanism:
  primary_change: CONTINUOUS_ENTRY_QUALITY_SCORE_WITH_FROZEN_RETENTION
  one_primary_mechanism_change_only: true
  hard_quality_gates_on_events: 0
  score_axes:
    - feature: pullback_amount_ratio
      direction: lower_is_better
      economic_semantics: quieter_retest_volume_is_healthier
    - feature: recovery_close_location
      direction: higher_is_better
      economic_semantics: decisive_recovery_close_is_stronger
    - feature: pre_entry_10d_return_percentile
      direction: lower_is_better
      economic_semantics: less_short_term_overheat_is_safer
  score_formula:
    axis_position: development_ecdf_mid_rank_quantile_position_q8_decimal
    aggregation: equal_weight_arithmetic_mean_of_three_axis_positions
    weight_tuning: forbidden
    direction_derivation_from_outcomes: forbidden
  holdout_score_mapping: frozen_development_ecdf_mid_rank_mapping_then_same_aggregation
  selection_rule:
    development: rank_by_score_desc_then_ts_code_asc_then_signal_date_asc_then_next_open_date_asc_take_top_k
    development_top_k: 94
    frozen_retention_fraction_of_188_parent_events: 0.50
    cut_score: score_of_the_rank_94_development_event
    holdout: keep_events_with_holdout_score_greater_than_or_equal_to_frozen_cut_score
    tie_policy_inside_top_k: deterministic_key_order_no_randomness
  anti_curve_fitting_notes:
    retention_fraction_is_a_round_number_frozen_before_profile: true
    retention_fraction_not_derived_from_ts_v6_0_l9_best_point_83: true
    score_formula_not_derived_from_any_outcome: true

density_dispersion_and_integration_gate:
  development:
    minimum_legal_events: 90
    minimum_distinct_signal_days: 36
    minimum_events_each_calendar_year: 10
    per_axis_interquartile_range_must_be_positive: true
    score_interquartile_range_must_be_positive: true
    each_axis_must_change_blended_selection_for_at_least_one_event: true
  conditional_density_only_holdout:
    minimum_distinct_signal_days: 20
    minimum_events_each_calendar_year: 10
  candidate_must_be_strict_subset_of_parent_events: true
  parent_event_key: [ts_code, signal_date, next_open_date]
  exact_parent_key_reconciliation_against_frozen_r3g1_events: true
  threshold_or_gate_change_after_profile: forbidden
  retention_fraction_change_after_profile: forbidden
  grid_or_fraction_expansion_after_profile: forbidden

mechanical_verdict:
  human_candidate_pick: forbidden
  go_requires_all_development_and_holdout_gates_pass: true
  holdout_density_may_not_replace_development_selection: true

result_firewall:
  allowed:
