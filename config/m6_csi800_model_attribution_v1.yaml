shared_handler:
  class: qlib.contrib.data.handler.Alpha158
  infer_processors:
    - {class: RobustZScoreNorm, fields_group: feature, clip_outlier: true}
    - {class: Fillna, fields_group: feature}
  learn_processors:
    - {class: DropnaLabel}
    - {class: CSRankNorm, fields_group: label}
  same_handler_state_per_window_across_arms: true

arms:
  - arm_id: clean_lgbm_control_v1
    role: CONTROL
    class: qlib.contrib.model.gbdt.LGBModel
    parameters:
      loss: mse
      learning_rate: 0.05
      num_leaves: 31
      max_depth: -1
      colsample_bytree: 0.8879
      subsample: 0.8789
      reg_alpha: 0.0421
      reg_lambda: 0.0220
      seed: 42
      feature_fraction_seed: 42
      bagging_seed: 42
      data_random_seed: 42
      num_threads: 8
      deterministic: true
      force_col_wise: true
      num_boost_round: 1000
      early_stopping_rounds: 50
    structure_question: current_nonlinear_tree_control_after_uniform_label_maturity_purge
  - arm_id: ridge_alpha1_v1
    role: ALTERNATIVE_1
    class: qlib.contrib.model.linear.LinearModel
    parameters:
      estimator: ridge
      alpha: 1.0
      fit_intercept: false
      include_valid: false
    structure_question: whether_a_regularized_linear_map_is_more_stable_than_tree_learning
  - arm_id: lgbm_ridge_rank_blend_50_50_v1
    role: ALTERNATIVE_2
    class: deterministic_score_fusion
    trained_models: [clean_lgbm_control_v1, ridge_alpha1_v1]
    parameters:
      transform: daily_cross_sectional_percentile_rank
      ascending: true
      tie_method: average
      lgbm_weight: 0.5
      ridge_weight: 0.5
      missing_member_policy: fail_closed_no_intersection_fallback
    structure_question: whether_fixed_learning_structure_diversification_adds_value

portfolio:
  strategy: BiweeklyTopkDropoutStrategy
  account_rmb: 100000000
  topk: 30
  n_drop: 3
  rebalance_trade_days: 10
  only_tradable: true
  forbid_all_trade_at_limit: false
  deal_price: open
  benchmark: SH000906
  open_cost: 0.0006
  close_cost: 0.0016
  minimum_cost_rmb: 5
  cost_multipliers: [1.0, 1.5, 2.0]
  capacity_model_added: false
  portfolio_variant_count: 0

coverage_gate:
  required_windows: [W1, W2, W3, W4, W5, W6]
  minimum_mature_score_days_per_window: 200
  minimum_pooled_mature_score_days: 1200
  identical_prediction_member_day_keys_across_arms: true
  no_bse_rows: true
  nonfinite_predictions: fail
  blend_minimum_cross_section_coverage_ratio: 0.99
  missing_or_drifted_input_policy: BLOCKED_PRE_EFFECT

primary_inference:
  outcome: paired_daily_net_active_return_delta_vs_clean_lgbm_control
  cost_multiplier: 1.0
  pooled_definition: chronological_concatenation_W1_through_W6
  hac_lags: 10
  alternative: greater
  familywise_alpha: 0.05
  multiplicity_method: holm
  hypothesis_family: [ridge_alpha1_v1, lgbm_ridge_rank_blend_50_50_v1]
  hypothesis_count: 2
  windows_and_cost_scenarios_are_not_independent_attempts: true

diagnostics:
  score_improvement:
    pooled_mean_rank_ic_delta_strictly_positive: true
    minimum_positive_delta_windows: 4
  portfolio_conversion:
    pooled_base_net_excess_delta_strictly_positive: true
    minimum_positive_base_delta_windows: 4
    pooled_1_5x_cost_delta_nonnegative: true
    pooled_2x_cost_delta_nonnegative: true
    maximum_turnover_ratio_vs_control: 1.10
    maximum_test_or_evaluable_stress_drawdown: 0.20
    primary_holm_adjusted_p_must_pass: true
  required_decomposition:
    - daily_rank_ic_and_delta
    - daily_score_spearman_vs_control
    - rebalance_top30_name_overlap
    - gross_active_return_delta
    - transaction_cost_delta
    - net_active_return_delta
    - turnover_ratio
    - maximum_drawdown
  stress_periods:
    style_shift_2017:
      status: NOT_EVALUABLE_NO_PRE_2017_FROZEN_MODEL
      must_remain_disclosed: true
    microcap_crash_2024:
      model_window: W6
      start: "2024-01-01"
      end: "2024-02-29"
    volume_price_drawdown_2026h1:
      model_window: W6
      start: "2026-01-01"
      end: "2026-06-30"
      stale_model_diagnostic_only: true

attribution_decision:
  decision_precedence:
    - BLOCKED
    - MODEL_STRUCTURE_SUPPORTED
    - PORTFOLIO_CONVERSION_BOTTLENECK_INDICATED
    - FEATURE_INFORMATION_BOTTLENECK_INDICATED
    - MIXED_NOT_CONCLUSIVE
  MODEL_STRUCTURE_SUPPORTED: >-
    至少一个替代臂同时通过score_improvement与portfolio_conversion；只允许主控评审下一独立前瞻协议。
  PORTFOLIO_CONVERSION_BOTTLENECK_INDICATED: >-
    至少一个替代臂通过score_improvement，但所有替代臂均未通过portfolio_conversion；下一批只能研究
    一个预冻结的组合转换变量，不得继续添加模型。
  FEATURE_INFORMATION_BOTTLENECK_INDICATED: >-
    两个替代臂均未通过score_improvement且均未通过portfolio_conversion；停止本模型家族，返回因子
    信息机制研究，不得增加第三个模型。
  MIXED_NOT_CONCLUSIVE: >-
    没有任何替代臂同时通过分数与组合门，且出现组合通过但分数不支持、不同替代臂分别只过一个门或
    其他不能落入前述类别的局部结果；停止并审计，不自动续跑。
  BLOCKED: 数据、身份、覆盖、确定性或执行证据任一不完整。
  decision_is_not_causal_proof: true
  production_authorization_for_every_outcome: none

attempt_policy:
  control_is_not_new_alternative_attempt: true
  alternative_attempt_count: 2
  attempts_are_counted_on_first_authorized_effect_read: true
  failed_implementation_after_effect_read_still_counts: true
  no_replacement_or_third_arm: true
  no_post_result_threshold_or_arm_change: true
