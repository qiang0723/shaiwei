candidates:
  - candidate_id: m5_gross_margin_improvement_v1
    mechanism: pricing_power_and_operating_quality
    formula: ((total_revenue_t - total_cogs_t) / total_revenue_t) - ((total_revenue_p - total_cogs_p) / total_revenue_p)
    expected_direction: 1
    inputs: [income.total_revenue_t, income.total_cogs_t, income.total_revenue_p, income.total_cogs_p]
    reference: https://doi.org/10.2307/2672906
  - candidate_id: m5_rd_intensity_improvement_v1
    mechanism: innovation_investment_intensity
    formula: rd_exp_t / total_revenue_t - rd_exp_p / total_revenue_p
    expected_direction: 1
    inputs: [income.rd_exp_t, income.total_revenue_t, income.rd_exp_p, income.total_revenue_p]
    reference: https://doi.org/10.1016/0165-4101(95)00410-6
  - candidate_id: m5_receivables_to_revenue_deterioration_v1
    mechanism: revenue_quality_and_collection_risk
    formula: accounts_receiv_t / total_revenue_t - accounts_receiv_p / total_revenue_p
    expected_direction: -1
    inputs: [balancesheet.accounts_receiv_t, income.total_revenue_t, balancesheet.accounts_receiv_p, income.total_revenue_p]
    reference: https://rpc.cfainstitute.org/research/financial-analysts-journal/1999/the-detection-of-earnings-manipulation
  - candidate_id: m5_inventory_accumulation_v1
    mechanism: demand_mismatch_and_inventory_risk
    formula: (inventories_t - inventories_p) / average_total_assets
    expected_direction: -1
    inputs: [balancesheet.inventories_t, balancesheet.inventories_p, balancesheet.total_assets_t, balancesheet.total_assets_p]
    reference: https://papers.ssrn.com/abstract=295247
  - candidate_id: m5_leverage_change_v1
    mechanism: financial_fragility
    formula: total_liab_t / total_assets_t - total_liab_p / total_assets_p
    expected_direction: -1
    inputs: [balancesheet.total_liab_t, balancesheet.total_assets_t, balancesheet.total_liab_p, balancesheet.total_assets_p]
    reference: https://doi.org/10.2307/2672906
  - candidate_id: m5_current_ratio_improvement_v1
    mechanism: short_term_liquidity_buffer
    formula: total_cur_assets_t / total_cur_liab_t - total_cur_assets_p / total_cur_liab_p
    expected_direction: 1
    inputs: [balancesheet.total_cur_assets_t, balancesheet.total_cur_liab_t, balancesheet.total_cur_assets_p, balancesheet.total_cur_liab_p]
    reference: https://doi.org/10.2307/2672906
  - candidate_id: m5_external_financing_dependence_v1
    mechanism: external_financing_and_future_return_risk
    formula: n_cash_flows_fnc_act_t / average_total_assets
    expected_direction: -1
    inputs: [cashflow.n_cash_flows_fnc_act_t, balancesheet.total_assets_t, balancesheet.total_assets_p]
    reference: https://papers.ssrn.com/abstract=383240
  - candidate_id: m5_free_cashflow_margin_improvement_v1
    mechanism: self_financing_capacity
    formula: free_cashflow_t / total_revenue_t - free_cashflow_p / total_revenue_p
    expected_direction: 1
    inputs: [cashflow.free_cashflow_t, income.total_revenue_t, cashflow.free_cashflow_p, income.total_revenue_p]
    reference: https://doi.org/10.2307/2672906

