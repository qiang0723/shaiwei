single_variable_contract:
  variable_path: portfolio.topk
  variable_name: topk
  control_value: 30
  treatment_value: 20
  rationale: >-
    M6-2已显示分数增量但Top30组合未转化；Top20是事先选择的唯一更窄宽度，并已有独立模拟账户协议
    证明操作化可行。本批不读取该模拟账户的相对业绩，也不测试10、15、25或其他TopK。
  prohibited_additional_values: [10, 15, 25, 30_plus]
  all_other_portfolio_fields_byte_semantically_equal: true

portfolio_constants:
  strategy: BiweeklyTopkDropoutStrategy
  account_rmb: 100000000
  n_drop: 3
  rebalance_trade_days: 10
  only_tradable: true
  forbid_all_trade_at_limit: false
  deal_price: open
  benchmark: SH000906
  open_cost: 0.0006
  close_cost: 0.0016
  minimum_cost_rmb: 5
  cost_multipliers: [1.0, 1.5, 2.0]
  cost_scenario_method: scale_recorded_base_daily_cost_without_rerunning_trades
  capacity_model_added: false
  allocation_and_cash_semantics: inherit_unmodified_biweekly_topk_dropout_defaults

