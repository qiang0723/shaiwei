  bse_row_outcome: BLOCKED_PRE_EFFECT
  paper_account_artifacts_as_historical_input: prohibited

primary_inference:
  outcome: >-
    paired_daily_difference_in_differences_of_net_active_return:
    (alternative_top20-clean_top20)-(alternative_top30-clean_top30)
  cost_multiplier: 1.0
  pooled_definition: chronological_concatenation_W1_through_W6
  hac_lags: 10
  alternative: greater
  familywise_alpha: 0.05
  multiplicity_method: holm
  hypothesis_family: [ridge_alpha1_v1, lgbm_ridge_rank_blend_50_50_v1]
  hypothesis_count: 2
  windows_and_cost_scenarios_are_not_independent_attempts: true

conversion_gate:
  interaction:
    primary_holm_adjusted_p_must_pass: true
    pooled_base_difference_in_differences_strictly_positive: true
    minimum_positive_difference_in_differences_windows: 4
  top20_direct_vs_clean_control:
    pooled_base_net_excess_delta_strictly_positive: true
    minimum_positive_base_delta_windows: 4
    pooled_1_5x_cost_delta_nonnegative: true
    pooled_2x_cost_delta_nonnegative: true
    maximum_turnover_ratio_vs_top20_clean_control: 1.10
    maximum_test_or_evaluable_stress_drawdown: 0.20
  predecessor_score_gate:
    reuse_authoritative_m6_score_pass_only: true
    new_rank_ic_hypothesis_or_threshold: false
  required_decomposition:
    - top20_and_top30_daily_net_active_return
    - top20_direct_delta_vs_clean_control
    - top30_predecessor_delta_vs_clean_control
    - paired_difference_in_differences
    - gross_active_return_delta
    - transaction_cost_delta
    - turnover_ratio
    - maximum_drawdown
    - scheduled_top20_name_overlap

decision_contract:
  precedence: [BLOCKED, TOPK20_CONVERSION_SUPPORTED, TOPK20_CONVERSION_NOT_SUPPORTED, MIXED_NOT_CONCLUSIVE]
  TOPK20_CONVERSION_SUPPORTED: >-
    至少一个既有替代分数臂同时通过interaction和Top20直接组合门；只支持下一阶段独立评审，不代表
    策略有效或生产准入。
  TOPK20_CONVERSION_NOT_SUPPORTED: >-
    两个既有替代分数臂均未通过interaction且均未通过Top20直接组合门；M6系列关闭并进入A1-0只读盘点。
  MIXED_NOT_CONCLUSIVE: >-
    没有臂同时通过两门，但存在仅通过interaction、仅通过直接组合门或两臂证据冲突；停止且不再测试
    其他TopK、n_drop、调仓周期、权重或新模型。
  BLOCKED: 输入身份、Top30复现、覆盖、确定性、执行或独立审计证据任一不完整。
  strategy_effective_for_every_outcome: NOT_EVALUATED_FOR_PRODUCTION
  production_authorization_for_every_outcome: none

