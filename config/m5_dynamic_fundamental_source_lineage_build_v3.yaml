    reads_files: false
    writes_files: false
    validates_three_time_semantics: true
  value_commitment:
    layer: domain
    suggested_module: m5_dynamic/lineage_commitment.py
    reads_files: false
    writes_files: false
    exposes_raw_values: false
  lineage_builder:
    layer: domain
    suggested_module: m5_dynamic/lineage.py
    reads_files: false
    writes_files: false
    computes_candidates: false
    selects_unproven_versions: false
  evidence_adapter:
    layer: adapter
    suggested_module: m5_dynamic/lineage_reader.py
    external_network: false
    reads_only_manifest_allowlist: true
    may_infer_provider_effective_time_from_ingest_time: false
  report_projection:
    layer: domain
    suggested_module: m5_dynamic/lineage_projection.py
