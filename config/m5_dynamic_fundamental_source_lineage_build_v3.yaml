    may_import_primary_lineage_builder: false
    may_import_runner_projection: false
  auditor_orchestration:
    layer: application
    suggested_module: m5_dynamic/lineage_auditor.py
    requires_independent_recompute: true

input_contract:
  mode: LINEAGE_FEASIBILITY
  exact_manifest_allowlist_required: true
  immutable_batch_observations_required: true
  observation_fields:
    - source_api
    - request_params_sha256
    - batch_id
    - content_sha256
    - local_observed_at
  statement_identity_fields: [ts_code, f_ann_date, end_date, report_type, update_flag]
  frozen_business_fields_by_table_required: true
  authoritative_evidence_bundle_optional_but_content_addressed: true
  missing_authoritative_evidence_is_data_no_go_not_runtime_error: true
  labels_effects_models_or_holdings_forbidden: true
  project_root_mount_forbidden: true

output_contract:
  schema_version: m5-source-lineage-gate-output-v1
  staging_root: /lineage-output
  required_files:
    - source_lineage_report.json
    - lineage_gate_report.json
    - run_manifest.json
  forbidden_files:
    - feature_panel.parquet
    - candidate_matrix.json
  write_once: true
  byte_determinism_required: true
  partial_directory_is_failure: true
  absolute_host_paths_forbidden: true
  row_level_identity_or_value_output_forbidden: true
  label_effect_model_fields_forbidden: true
  pass_verdict: GO_M5_2_SOURCE_LINEAGE_RECOVERABLE
  no_go_verdict: NO_GO_M5_2_SOURCE_LINEAGE_PREEXECUTION
  no_go_target_state: BLOCKED_DATA
  strategy_effective: NOT_EVALUATED
  production_authorization: none

auditor_contract:
  output_file: lineage_audit_report.json
  runner_output_mount: /lineage-output:ro
  audit_mount: /lineage-audit:rw
  independent_value_commitment_required: true
  independent_interval_rebuild_required: true
  forbidden_field_scan_required: true
  physical_and_canonical_hashes_required: true
  verdict_recompute_required: true
  audit_pass_required_before_registrar: true

