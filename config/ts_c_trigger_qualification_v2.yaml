    sha256: f52392281d17469be4f9a90600cde714a34b5b214148be2ac56a24ea7132fc08
  v1_audit:
    path: data/research/trend_swing/ts-c-trigger-qualification-v1-r2/audit.json
    sha256: 1fc2fae2a8aa14870ff170efc6439a807e30c48d56e9f54b557872ea49bf059b

user_rulings_20260819_binding:
  permission_on_year_density_semantics_approved: true
  justification_is_design_semantics_not_outcome: >-
    the frozen v3 eligibility stack is designed to stay flat in bear regimes; evaluating density
    per calendar year penalizes that design behavior rather than trigger quality, so the year
    axis is re-scoped to permission-ON years with identical thresholds
  v1_verdict_unchanged_and_preserved: true
  effect_attempts_consumed: 0

frozen_inputs:
  raw_market_store:
    r3_frozen_input_manifest:
      path: data/research/trend_swing/ts-v3-data-gate-r3/input_manifest.json
      sha256: c2206a6fddc83500293ee7e7d8fd399cdc8df3709579f92f16a228bc16494a63
      role: verified_immutable_raw_snapshot_binding
    raw_data_mutation_authorized: false
    network_requests_authorized: false

eligibility_stack: exact_from_v1_protocol
trigger_arms: exact_from_v1_protocol
shared_event_semantics: exact_from_v1_protocol
qualification_period: exact_from_v1_protocol

permission_on_year_rule:
  definition: >-
    a calendar year is permission-ON when the frozen index monthly double permission (prev
    complete month close above its SMA6 and SMA6 rising) holds on at least 50 percent of the
    year's open days, computed from bound index data only
  computed_from: bound_index_000906_daily_only
  not_derived_from_event_counts: true
  minimum_permission_on_years_required: 4
  events_in_permission_off_years_still_count_toward_totals: true

density_gate:
  per_trigger_minimum_confirmed_events: 120
  per_trigger_minimum_events_each_permission_on_calendar_year: 10
  per_trigger_minimum_distinct_signal_days: 40
  bse_row_maximum: 0
  threshold_change_after_profile: forbidden
  no_trigger_parameter_tuning: true

result_firewall: exact_from_v1_protocol

execution_control:
  fixtures_must_pass_before_real_profile: true
  one_real_profile: true
  one_independent_audit: true
  external_network_or_provider: false
  env_or_secret_read: false
  docker_network_mode: none
  source_mounts_read_only: true
  output_write_once: true
  deepseek_or_any_llm_call: false
  paper_web_scheduler_or_production_change: false
  same_scope_rerun: forbidden

verdicts:
  at_least_one_trigger_survives: GO_TS_C_TOURNAMENT_PROTOCOL_DRAFT_ONLY
  no_trigger_survives: STOP_TS_C_NO_DENSE_LEGAL_TRIGGER
  input_or_execution_failure: BLOCKED_TS_C_QUALIFICATION
  strategy_effective: NOT_EVALUATED
  production_authorization: none

successor_boundary: exact_from_v1_protocol
