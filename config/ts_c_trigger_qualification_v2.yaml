strategy_family: TS-C
production_authorization: none

objective:
  primary_question: >-
    which of the three mechanically distinct pullback trigger definitions produce a dense and
    legal enough confirmed-event stream on the frozen TS-C eligibility stack, with density
    evaluated per permission-ON calendar year, measured by event counts and coverage only
  downstream_decision: advance_surviving_triggers_to_the_frozen_tournament_protocol
  strategy_effect_evaluation: false
  post_entry_outcomes_allowed: false

predecessor_chain:
  v1_protocol:
    path: config/ts_c_trigger_qualification_v1.yaml
    sha256: 0cf969edf29dfe103d9538e35c1efe983f91d505f027688f89c6dc5815c0bcef
  v1_acceptance: docs/TS_C_TRIGGER_QUALIFICATION_ACCEPTANCE_20260819.md
  v1_profile:
