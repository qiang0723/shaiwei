services:
  m6-topk-conversion-fixture:
    image: shaiwei:m6-topk-conversion-engineering-v1
    pull_policy: never
    profiles: [m6-topk-conversion]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SHAIWEI_RELEASE_GIT_HEAD: ${SHAIWEI_M6_TOPK_ENGINEERING_GIT_HEAD:-}
    init: true
    restart: "no"
    user: "${SHAIWEI_HOST_UID:-10001}:${SHAIWEI_HOST_GID:-10001}"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,mode=1777
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    environment:
      HOME: /tmp
      MPLCONFIGDIR: /tmp/matplotlib
      PYTHONPYCACHEPREFIX: /tmp/pycache
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    volumes:
      - type: bind
        source: ./data/research/m6_csi800_topk20_conversion_v1/engineering/runner
        target: /workspace/data/research/m6_csi800_topk20_conversion_v1/engineering/runner
        read_only: false
        bind:
          create_host_path: false
    command:
      - python
      - -m
      - shaiwei.research.topk_conversion.synthetic
      - --output-root
      - /workspace/data/research/m6_csi800_topk20_conversion_v1/engineering/runner

  m6-topk-conversion-auditor:
    image: shaiwei:m6-topk-conversion-engineering-v1
    pull_policy: never
    profiles: [m6-topk-conversion]
    init: true
    restart: "no"
    user: "${SHAIWEI_HOST_UID:-10001}:${SHAIWEI_HOST_GID:-10001}"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    pids_limit: 64
    mem_limit: 1g
    cpus: 1.0
    environment:
      HOME: /tmp
      MPLCONFIGDIR: /tmp/matplotlib
      PYTHONPYCACHEPREFIX: /tmp/pycache
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    volumes:
      - type: bind
        source: ./data/research/m6_csi800_topk20_conversion_v1/engineering/runner
        target: /workspace/data/research/m6_csi800_topk20_conversion_v1/engineering/runner
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/research/m6_csi800_topk20_conversion_v1/engineering/audit
        target: /workspace/data/research/m6_csi800_topk20_conversion_v1/engineering/audit
        read_only: false
        bind:
          create_host_path: false
    command:
      - python
      - -m
      - shaiwei.research.topk_conversion.audit
      - --runner-root
      - /workspace/data/research/m6_csi800_topk20_conversion_v1/engineering/runner
      - --audit-root
      - /workspace/data/research/m6_csi800_topk20_conversion_v1/engineering/audit
