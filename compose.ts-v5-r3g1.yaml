x-r3g1-base: &r3g1-base
  image: shaiwei:ts-v5-r3g1-recent-density-001
  pull_policy: never
  init: true
  user: "${SHAIWEI_HOST_UID:-10001}:${SHAIWEI_HOST_GID:-10001}"
  network_mode: none
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp:rw,noexec,nosuid,size=128m,mode=1777]
  pids_limit: 64
  mem_limit: 10g
  cpus: 4
  environment: [HOME=/tmp, PYTHONPYCACHEPREFIX=/tmp/pycache]
  volumes:
    - {type: bind, source: ./data/raw, target: /workspace/data/raw, read_only: true, bind: {create_host_path: false}}
    - {type: bind, source: ./data/research/trend_swing/ts-v3-data-gate-r3/input_manifest.json, target: /workspace/data/research/trend_swing/ts-v3-data-gate-r3/input_manifest.json, read_only: true, bind: {create_host_path: false}}
    - {type: bind, source: ./data/research/trend_swing/ts-v5-r3f-canary-001, target: /workspace/data/research/trend_swing/ts-v5-r3f-canary-001, read_only: true, bind: {create_host_path: false}}
    - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g-executable-semantics, target: /workspace/data/research/trend_swing/ts-v5-r3g-executable-semantics, read_only: true, bind: {create_host_path: false}}
    - {type: bind, source: ./ledger/ts_v5_r3f_llm_attempts.csv, target: /workspace/ledger/ts_v5_r3f_llm_attempts.csv, read_only: true, bind: {create_host_path: false}}
    - {type: bind, source: ./ledger/ts_v5_r3f_llm_transports.csv, target: /workspace/ledger/ts_v5_r3f_llm_transports.csv, read_only: true, bind: {create_host_path: false}}
    - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g1-recent-density-001, target: /workspace/data/research/trend_swing/ts-v5-r3g1-recent-density-001, bind: {create_host_path: false}}

services:
  ts-v5-r3g1-profile:
    <<: *r3g1-base
    profiles: [ts-v5-r3g1]
    command: [python, -m, shaiwei.research.trend_swing.v5_r3g1_cli, profile]
  ts-v5-r3g1-audit:
    <<: *r3g1-base
    profiles: [ts-v5-r3g1-audit]
    command: [python, -m, shaiwei.research.trend_swing.v5_r3g1_cli, audit]
