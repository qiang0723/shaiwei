services:
  m6-effect-runner:
    image: shaiwei:m6-model-attribution-release-v1
    pull_policy: never
    profiles: [m6-effect]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SHAIWEI_RELEASE_GIT_HEAD: ${SHAIWEI_M6_EFFECT_RELEASE_GIT_HEAD:-}
    init: true
    restart: "no"
    user: "${SHAIWEI_HOST_UID:-10001}:${SHAIWEI_HOST_GID:-10001}"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=4g,mode=1777
    pids_limit: 256
    mem_limit: 12g
    cpus: 6.0
    environment:
      HOME: /tmp
      MPLCONFIGDIR: /tmp/matplotlib
      PYTHONPYCACHEPREFIX: /tmp/pycache
      OMP_NUM_THREADS: "6"
      OPENBLAS_NUM_THREADS: "6"
      MKL_NUM_THREADS: "6"
      NUMEXPR_NUM_THREADS: "6"
    volumes:
      - type: bind
        source: ./data/qlib_bin
        target: /qlib
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/m6_csi800_model_attribution_release_scope_v1.json
        target: /inputs/release.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/control/m6_csi800_model_attribution_v1/approval.json
        target: /inputs/approval.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/research/m6_csi800_model_attribution_v1/effect
        target: /outputs
        read_only: false
        bind:
          create_host_path: false
    command:
      - python
      - -m
      - shaiwei.research.model_attribution.effect_run
      - --release
      - /inputs/release.json
      - --approval
      - /inputs/approval.json
      - --provider-root
      - /qlib
      - --output-root
      - /outputs

  m6-effect-auditor:
    image: shaiwei:m6-model-attribution-release-v1
    pull_policy: never
    profiles: [m6-effect]
    init: true
    restart: "no"
    user: "${SHAIWEI_HOST_UID:-10001}:${SHAIWEI_HOST_GID:-10001}"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g,mode=1777
    pids_limit: 256
    mem_limit: 4g
    cpus: 2.0
    environment:
      HOME: /tmp
      MPLCONFIGDIR: /tmp/matplotlib
      PYTHONPYCACHEPREFIX: /tmp/pycache
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    volumes:
      - type: bind
        source: ./config/m6_csi800_model_attribution_release_scope_v1.json
        target: /inputs/release.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/control/m6_csi800_model_attribution_v1/approval.json
        target: /inputs/approval.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/research/m6_csi800_model_attribution_v1/effect
        target: /outputs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/research/m6_csi800_model_attribution_v1/effect-audit
        target: /audit
        read_only: false
        bind:
          create_host_path: false
    command:
      - python
      - -m
      - shaiwei.research.model_attribution.effect_audit
      - --release
      - /inputs/release.json
      - --approval
      - /inputs/approval.json
      - --effect-root
      - /outputs
      - --audit-root
      - /audit
