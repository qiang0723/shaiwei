x-ts-v6-1-base: &ts-v6-1-base
  image: shaiwei:ts-v6-1-entry-quality-ranking-preflight-v1
  pull_policy: never
  init: true
  restart: "no"
  user: "${SHAIWEI_HOST_UID:-10001}:${SHAIWEI_HOST_GID:-10001}"
  working_dir: /workspace
  read_only: true
  network_mode: none
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  cpus: 4.0
  mem_limit: 10g
  environment:
    HOME: /tmp
    PYTHONPYCACHEPREFIX: /tmp/pycache
    OMP_NUM_THREADS: "2"
    OPENBLAS_NUM_THREADS: "2"
    MKL_NUM_THREADS: "2"
    NUMEXPR_NUM_THREADS: "2"
  tmpfs: ["/tmp:rw,noexec,nosuid,size=1g,mode=1777"]

services:
  ts-v6-1-ranking-fixture:
    <<: *ts-v6-1-base
    profiles: [ts-v6-1-fixture]
    build:
      context: .
      dockerfile: Dockerfile.ts-v6-1-ranking
      network: none
      args:
        SHAIWEI_RELEASE_GIT_HEAD: ${SHAIWEI_TS_V6_1_RELEASE_GIT_HEAD:-}
    command: [python, -m, pytest, -q, tests/test_ts_v6_1_ranking_protocol.py, tests/test_ts_v6_1_ranking_engine.py]

  ts-v6-1-ranking-profile:
    <<: *ts-v6-1-base
    profiles: [ts-v6-1-live]
    volumes:
      - {type: bind, source: ./data/research/trend_swing/ts-v6-entry-quality-preflight-v1/parent_observations.parquet, target: /workspace/data/research/trend_swing/ts-v6-entry-quality-preflight-v1/parent_observations.parquet, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v6-entry-quality-preflight-v1/profile.json, target: /workspace/data/research/trend_swing/ts-v6-entry-quality-preflight-v1/profile.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v6-entry-quality-preflight-v1/manifest.json, target: /workspace/data/research/trend_swing/ts-v6-entry-quality-preflight-v1/manifest.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v6-entry-quality-preflight-v1/audit.json, target: /workspace/data/research/trend_swing/ts-v6-entry-quality-preflight-v1/audit.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g1-recent-density-r2/events.parquet, target: /workspace/data/research/trend_swing/ts-v5-r3g1-recent-density-r2/events.parquet, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g1-recent-density-r2/density_profile.json, target: /workspace/data/research/trend_swing/ts-v5-r3g1-recent-density-r2/density_profile.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g1-recent-density-r2/audit.json, target: /workspace/data/research/trend_swing/ts-v5-r3g1-recent-density-r2/audit.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v6-1-entry-quality-ranking-preflight-v1, target: /workspace/data/research/trend_swing/ts-v6-1-entry-quality-ranking-preflight-v1, read_only: false, bind: {create_host_path: false}}
    command: [python, -m, shaiwei.research.trend_swing.v6_1.cli, profile]

  ts-v6-1-ranking-auditor:
    <<: *ts-v6-1-base
    profiles: [ts-v6-1-live]
    volumes:
      - {type: bind, source: ./data/research/trend_swing/ts-v6-entry-quality-preflight-v1/parent_observations.parquet, target: /workspace/data/research/trend_swing/ts-v6-entry-quality-preflight-v1/parent_observations.parquet, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v6-entry-quality-preflight-v1/profile.json, target: /workspace/data/research/trend_swing/ts-v6-entry-quality-preflight-v1/profile.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v6-entry-quality-preflight-v1/manifest.json, target: /workspace/data/research/trend_swing/ts-v6-entry-quality-preflight-v1/manifest.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v6-entry-quality-preflight-v1/audit.json, target: /workspace/data/research/trend_swing/ts-v6-entry-quality-preflight-v1/audit.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g1-recent-density-r2/events.parquet, target: /workspace/data/research/trend_swing/ts-v5-r3g1-recent-density-r2/events.parquet, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g1-recent-density-r2/density_profile.json, target: /workspace/data/research/trend_swing/ts-v5-r3g1-recent-density-r2/density_profile.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v5-r3g1-recent-density-r2/audit.json, target: /workspace/data/research/trend_swing/ts-v5-r3g1-recent-density-r2/audit.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/trend_swing/ts-v6-1-entry-quality-ranking-preflight-v1, target: /workspace/data/research/trend_swing/ts-v6-1-entry-quality-ranking-preflight-v1, read_only: false, bind: {create_host_path: false}}
    command: [python, -m, shaiwei.research.trend_swing.v6_1.cli, audit]
