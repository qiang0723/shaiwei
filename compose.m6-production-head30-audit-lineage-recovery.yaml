      - {type: bind, source: ./config/m6_csi800_production_head30_audit_entrypoint_recovery_scope_v1.json, target: /inputs/r4-release.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./config/m6_csi800_production_head30_audit_identity_recovery_v1.yaml, target: /inputs/r3-protocol.yaml, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./config/m6_csi800_production_head30_audit_identity_recovery_scope_v1.json, target: /inputs/r3-release.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./config/m6_csi800_production_head30_audit_entrypoint_recovery_execution_failure_v1.json, target: /inputs/r4-execution-failure.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./config/m6_csi800_production_head30_price_recovery_scope_v1.json, target: /inputs/original-release.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/control/m6_csi800_production_head30_v1/approval-r2.json, target: /inputs/original-approval.json, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/m6_csi800_production_head30_v1/effect-r2, target: /outputs, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/research/m6_csi800_production_head30_v1/effect-r2-audit-lineage-entry-recovery, target: /audit, read_only: false, bind: {create_host_path: false}}
    command:
      - python
      - /opt/shaiwei/m6-head30-audit-lineage-recovery/entrypoint.py
      - --recovery-protocol
      - /inputs/recovery-protocol.yaml
      - --recovery-release
      - /inputs/recovery-release.json
      - --recovery-approval
      - /inputs/recovery-approval.json
      - --recovery-compose
      - /inputs/recovery-compose.yaml
      - --r4-release
      - /inputs/r4-release.json
      - --r3-protocol
      - /inputs/r3-protocol.yaml
      - --r3-release
      - /inputs/r3-release.json
      - --r4-failure-evidence
      - /inputs/r4-execution-failure.json
      - --original-release
      - /inputs/original-release.json
      - --original-approval
      - /inputs/original-approval.json
      - --effect-root
      - /outputs
      - --audit-root
      - /audit
