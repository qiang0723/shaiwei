  research-control:
    image: shaiwei:research-control-v1
    profiles: [web, control]
    build:
      context: .
      dockerfile: Dockerfile.control
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.50
    restart: unless-stopped
    command:
      - uvicorn
      - shaiwei.research_control.api:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8090"
      - --workers
      - "1"
      - --limit-concurrency
      - "16"
      - --timeout-keep-alive
      - "5"
      - --no-access-log
    expose:
      - "8090"
    secrets:
      - source: m5_control_proxy_token
        target: m5_control_proxy_token
    volumes:
      - type: bind
        source: ./data/control/m5/runtime
        target: /workspace/data/control/m5
        read_only: false
        bind: {create_host_path: false}
      - type: bind
        source: ./config/m5_research_proposal_control_v2.yaml
        target: /workspace/config/m5_research_proposal_control_v2.yaml
