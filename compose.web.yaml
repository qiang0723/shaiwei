  web-ui:
    <<: *web-security
    command:
      - uvicorn
      - shaiwei.web.ui:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --workers
      - "1"
      - --limit-concurrency
      - "32"
      - --timeout-keep-alive
      - "5"
      - --no-access-log
    environment:
      WEB_QUERY_BASE_URL: http://web-query:8000
      WEB_CONTROL_BASE_URL: http://research-control:8090
      WEB_CONTROL_ALLOWED_ORIGIN: http://127.0.0.1:8080
      WEB_CONTROL_PROXY_TOKEN_FILE: /run/secrets/m5_control_proxy_token
    secrets:
      - source: m5_control_proxy_token
        target: m5_control_proxy_token
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      web-query:
        condition: service_healthy
      research-control:
        condition: service_healthy
    networks:
      - web-loopback
      - web-internal
      - control-internal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  web-internal:
    internal: true
  web-loopback:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
  control-internal:
    internal: true

secrets:
  m5_control_proxy_token:
    file: ./data/control/m5/proxy_token
