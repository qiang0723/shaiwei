name: shaiwei-web

x-web-security: &web-security
  image: shaiwei:web-v1
  profiles: [web]
  init: true
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,mode=1777
  pids_limit: 128
  mem_limit: 384m
  cpus: 0.75
  restart: unless-stopped

services:
  web-query:
    <<: *web-security
    build:
      context: .
      dockerfile: Dockerfile.web
    command:
      - uvicorn
      - shaiwei.web.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --limit-concurrency
      - "32"
      - --timeout-keep-alive
      - "5"
      - --no-access-log
    expose:
      - "8000"
    volumes:
      - type: bind
        source: ./ledger
        target: /workspace/ledger
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/paper
        target: /workspace/data/paper
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/shadow/signals
        target: /workspace/data/shadow/signals
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/shadow/reconciliations
        target: /workspace/data/shadow/reconciliations
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/web/research_snapshots
        target: /workspace/data/web/research_snapshots
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/web/security_names
        target: /workspace/data/web/security_names
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./logs/notifications
        target: /workspace/logs/notifications
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./logs/sentinels
        target: /workspace/logs/sentinels
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./logs/releases
        target: /workspace/logs/releases
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./logs/scheduler
        target: /workspace/logs/scheduler
        read_only: true
        bind:
          create_host_path: false
    networks: [web-internal]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  research-projector:
    <<: *web-security
    profiles: [research-projection]
    restart: "no"
    network_mode: none
    command:
      - python
      - -m
      - shaiwei.web.research_projection
      - build
    volumes:
      - type: bind
        source: ./config/p3_factor_experiment_queries_v1.yaml
        target: /workspace/config/p3_factor_experiment_queries_v1.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
