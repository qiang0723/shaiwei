        target: /workspace/docs/M5_DYNAMIC_FUNDAMENTAL_SOURCE_LINEAGE_SCOPE_RECOVERY_REAL_RUN_ACCEPTANCE_20260806.md
        read_only: true
        bind: {create_host_path: false}
      - type: bind
