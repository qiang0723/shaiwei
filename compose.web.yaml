name: shaiwei-web

x-web-security: &web-security
  image: shaiwei:web-v1
  profiles: [web]
  init: true
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,mode=1777
  pids_limit: 128
  mem_limit: 384m
  cpus: 0.75
  restart: unless-stopped

services:
  web-query:
    <<: *web-security
    build:
      context: .
      dockerfile: Dockerfile.web
    command:
      - uvicorn
      - shaiwei.web.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --limit-concurrency
      - "32"
      - --timeout-keep-alive
      - "5"
      - --no-access-log
    expose:
      - "8000"
    volumes:
      - type: bind
        source: ./ledger
        target: /workspace/ledger
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/paper
        target: /workspace/data/paper
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/shadow/signals
        target: /workspace/data/shadow/signals
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/shadow/reconciliations
        target: /workspace/data/shadow/reconciliations
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/web/research_snapshots
        target: /workspace/data/web/research_snapshots
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/web/security_names
        target: /workspace/data/web/security_names
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./logs/notifications
        target: /workspace/logs/notifications
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./logs/sentinels
        target: /workspace/logs/sentinels
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./logs/releases
        target: /workspace/logs/releases
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./logs/scheduler
        target: /workspace/logs/scheduler
        read_only: true
        bind:
          create_host_path: false
    networks: [web-internal]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  research-projector:
    <<: *web-security
    profiles: [research-projection]
    restart: "no"
    network_mode: none
    command:
      - python
      - -m
      - shaiwei.web.research_projection
      - build
    volumes:
      - type: bind
        source: ./config/p3_factor_experiment_queries_v1.yaml
        target: /workspace/config/p3_factor_experiment_queries_v1.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/p3_experiment_catalog_v1.yaml
        target: /workspace/config/p3_experiment_catalog_v1.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./ledger
        target: /workspace/ledger
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./logs/g1
        target: /workspace/logs/g1
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/research/g1/stage1-gp-preflight-v1
        target: /workspace/data/research/g1/stage1-gp-preflight-v1
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/research/moneyflow/experiments/p1-moneyflow-v1
        target: /workspace/data/research/moneyflow/experiments/p1-moneyflow-v1
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/research/star50/p2-star50-engineering-v1/engineering_report.json
        target: /workspace/data/research/star50/p2-star50-engineering-v1/engineering_report.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/research/star50/p2-star50-effect-v1/effect_report.json
        target: /workspace/data/research/star50/p2-star50-effect-v1/effect_report.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/research/star50/p2-star50-effect-correction-v1/effect_correction_report.json
        target: /workspace/data/research/star50/p2-star50-effect-correction-v1/effect_correction_report.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./docs/D1_LLM_FACTOR_REVIEW_SEMANTIC_CORRECTION_20260725.json
        target: /workspace/docs/D1_LLM_FACTOR_REVIEW_SEMANTIC_CORRECTION_20260725.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./docs/P2_STAR50_EFFECT_INVALIDATION_ADDENDUM_20260725.md
        target: /workspace/docs/P2_STAR50_EFFECT_INVALIDATION_ADDENDUM_20260725.md
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./docs/P2_STAR50_EFFECT_CORRECTION_ACCEPTANCE_20260725.md
        target: /workspace/docs/P2_STAR50_EFFECT_CORRECTION_ACCEPTANCE_20260725.md
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/web/research_snapshots
        target: /workspace/data/web/research_snapshots
        read_only: false
        bind:
          create_host_path: false

  strategy-factory-projector:
    <<: *web-security
    profiles: [strategy-factory-projection]
    restart: "no"
    network_mode: none
    command:
      - python
      - -m
      - shaiwei.web.strategy_factory_projection
      - build
    volumes:
      - type: bind
        source: ./config/m5_strategy_factory_v1.yaml
        target: /workspace/config/m5_strategy_factory_v1.yaml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./config/m5_strategy_factory_authority_addendum_v2.yaml
        target: /workspace/config/m5_strategy_factory_authority_addendum_v2.yaml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./config/m1_multi_universe_v1.yaml
        target: /workspace/config/m1_multi_universe_v1.yaml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./docs/M5_STRATEGY_FACTORY_PROTOCOL_20260805.md
        target: /workspace/docs/M5_STRATEGY_FACTORY_PROTOCOL_20260805.md
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./docs/M5_STRATEGY_FACTORY_COUNT_CORRECTION_PROTOCOL_20260805.md
        target: /workspace/docs/M5_STRATEGY_FACTORY_COUNT_CORRECTION_PROTOCOL_20260805.md
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./docs/P0_FORWARD_ACCEPTANCE_20260722.md
        target: /workspace/docs/P0_FORWARD_ACCEPTANCE_20260722.md
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./docs/M3_STAR_CUSTOM_PIT_ACCEPTANCE_20260802.md
        target: /workspace/docs/M3_STAR_CUSTOM_PIT_ACCEPTANCE_20260802.md
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./docs/P4_STAR100_DATA_FEASIBILITY_ACCEPTANCE_20260726.md
        target: /workspace/docs/P4_STAR100_DATA_FEASIBILITY_ACCEPTANCE_20260726.md
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./docs/M2_STAR200_DATA_FEASIBILITY_ACCEPTANCE_20260802.md
        target: /workspace/docs/M2_STAR200_DATA_FEASIBILITY_ACCEPTANCE_20260802.md
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./docs/P1_MONEYFLOW_EXPERIMENT_ACCEPTANCE_20260724.md
        target: /workspace/docs/P1_MONEYFLOW_EXPERIMENT_ACCEPTANCE_20260724.md
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./docs/F1_CSI800_FUNDAMENTAL_EFFECT_ACCEPTANCE_20260803.md
        target: /workspace/docs/F1_CSI800_FUNDAMENTAL_EFFECT_ACCEPTANCE_20260803.md
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./docs/F2_CSI800_FUNDAMENTAL_EFFECT_ACCEPTANCE_20260803.md
        target: /workspace/docs/F2_CSI800_FUNDAMENTAL_EFFECT_ACCEPTANCE_20260803.md
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./docs/P2_STAR50_EFFECT_CORRECTION_ACCEPTANCE_20260725.md
        target: /workspace/docs/P2_STAR50_EFFECT_CORRECTION_ACCEPTANCE_20260725.md
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./docs/M1_STAR50_FACTOR_DISCOVERY_ACCEPTANCE_20260801.md
        target: /workspace/docs/M1_STAR50_FACTOR_DISCOVERY_ACCEPTANCE_20260801.md
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./docs/M1_STAR50_FACTOR_REVIEW_ACCEPTANCE_20260801.md
        target: /workspace/docs/M1_STAR50_FACTOR_REVIEW_ACCEPTANCE_20260801.md
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./docs/M3_MULTI_POOL_FACTOR_DISCOVERY_ACCEPTANCE_20260802.md
        target: /workspace/docs/M3_MULTI_POOL_FACTOR_DISCOVERY_ACCEPTANCE_20260802.md
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./docs/M3_MULTI_POOL_FACTOR_PREEXECUTION_PROTOCOL_20260802.md
        target: /workspace/docs/M3_MULTI_POOL_FACTOR_PREEXECUTION_PROTOCOL_20260802.md
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./docs/M3_MULTI_POOL_FACTOR_REVIEW_ACCEPTANCE_20260802.md
        target: /workspace/docs/M3_MULTI_POOL_FACTOR_REVIEW_ACCEPTANCE_20260802.md
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./docs/M4_STAR50_RESIDUAL_EFFECT_ACCEPTANCE_20260805.md
        target: /workspace/docs/M4_STAR50_RESIDUAL_EFFECT_ACCEPTANCE_20260805.md
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./ledger/factor_admissions.csv
        target: /workspace/ledger/factor_admissions.csv
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./data/web/research_snapshots
        target: /workspace/data/web/research_snapshots
        read_only: false
        bind:
          create_host_path: false

  security-name-projector:
    image: shaiwei:local
    profiles: [security-name-projection]
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    restart: "no"
    network_mode: none
    command: ["python", "-m", "shaiwei.web.security_names"]
    volumes:
      - type: bind
        source: ./src
        target: /workspace/src
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./ledger/ingest_batches.csv
        target: /workspace/ledger/ingest_batches.csv
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/raw/source=tushare/api=namechange
        target: /workspace/data/raw/source=tushare/api=namechange
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/raw/source=tushare/api=stock_basic
        target: /workspace/data/raw/source=tushare/api=stock_basic
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/web/security_names
        target: /workspace/data/web/security_names
        read_only: false
        bind:
          create_host_path: false

  web-ui:
    <<: *web-security
    command:
      - uvicorn
      - shaiwei.web.ui:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --workers
      - "1"
      - --limit-concurrency
      - "32"
      - --timeout-keep-alive
      - "5"
      - --no-access-log
    environment:
      WEB_QUERY_BASE_URL: http://web-query:8000
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      web-query:
        condition: service_healthy
    networks:
      - web-loopback
      - web-internal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  web-internal:
    internal: true
  web-loopback:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
