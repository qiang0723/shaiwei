          create_host_path: false

  security-name-projector:
    image: shaiwei:local
    profiles: [security-name-projection]
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    restart: "no"
    network_mode: none
    command: ["python", "-m", "shaiwei.web.security_names"]
    volumes:
      - type: bind
        source: ./src
        target: /workspace/src
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./ledger/ingest_batches.csv
        target: /workspace/ledger/ingest_batches.csv
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/raw/source=tushare/api=namechange
