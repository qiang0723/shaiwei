services:
  scheduler:
    image: ${SHAIWEI_R2D_R3A_IMAGE:?fixture image is required}
    init: true
    working_dir: /workspace
    network_mode: none
    environment:
      SHAIWEI_DATA_ROOT: /workspace/data
      SHAIWEI_LOCK_AUTHORITY: docker-named-volume-v1
      SHAIWEI_LOCK_ROOT: /run/shaiwei-locks
      TZ: Asia/Shanghai
    volumes:
      - type: bind
        source: ${SHAIWEI_R2D_R3A_DATA:?fixture data root is required}
        target: /workspace/data
        bind:
          create_host_path: false
      - type: bind
        source: ${SHAIWEI_R2D_R3A_LEDGER:?fixture ledger root is required}
        target: /workspace/ledger
        bind:
          create_host_path: false
      - type: bind
        source: ${SHAIWEI_R2D_R3A_LOGS:?fixture logs root is required}
        target: /workspace/logs
        bind:
          create_host_path: false
      - type: volume
        source: runtime-locks
        target: /run/shaiwei-locks
        volume:
          nocopy: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
      - /root/.cache:rw,noexec,nosuid,size=128m,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - python
      - -c
      - >-
        import time;
        from shaiwei.pipeline.scheduler import write_health;
        time.sleep(3);
        write_health("running", detail="r2d-r3a-synthetic");
        time.sleep(120)
    healthcheck:
      test: ["CMD", "python", "-m", "shaiwei.pipeline.scheduler", "--healthcheck"]
      interval: 5m
      start_interval: 10s
      timeout: 15s
      retries: 3
      start_period: 2m

volumes:
  runtime-locks:
    external: true
    name: shaiwei_runtime_locks_v1
